                echo "- **Failure kind:** $BUILD_FAILURE_KIND"
                echo "- **Action:** escalated for environment/dependency correction"
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"manual_review\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
              exit 0
            fi
          fi

          if [ -n "$PR" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:management-needed" \
              --remove-label "agent:manual-review-needed" \
              --remove-label "agent:infra-blocked" \
              --remove-label "agent:provider-auth-failure" \
              --remove-label "agent:needs-decomposition" || true
            {
              echo "**Agent Work Loop** completed."
              echo ""
              echo "- **PR:** #$PR"
              echo "- **Status:** Implementation submitted"
              echo "- **Provider:** $PROVIDER_USED"
              echo "- **Focus:** $STRATEGY_FOCUS"
              echo "- **Next:** Awaiting independent verification"
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"pr\":$PR,\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"submitted\",\"meta_eval\":\"on_track\",\"managerial_fix\":\"none\",\"next_action\":\"verify\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          elif [ "$PUSH_FAILED" = "true" ]; then
            echo "result=infra-failure" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "escalation_reason=scm_push_failure" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --add-label "agent:actionable" \
              --add-label "triage/ready" \
              --add-label "agent:management-needed" \
              --add-label "agent:manual-review-needed" || true
            {
              echo "**Agent Work Loop** — branch push/PR creation failure."
              echo ""
              echo "- **Provider attempted:** $PROVIDER_USED"
              echo "- **Worker outcome:** $WORKER_OUTCOME"
              echo "- **Push status:** failed"
              echo ""
              echo "Action needed:"
              echo "1. Check repository permissions/protection and branch push access."
              echo "2. Keep issue actionable for retry once SCM path is healthy."
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          elif [ "$PR_CREATE_FAILED" = "true" ]; then
            echo "result=infra-failure" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            if [ "$PR_CREATE_ERROR_KIND" = "permissions" ]; then
              echo "escalation_reason=scm_pr_creation_permission" >> "$GITHUB_OUTPUT"
            else
              echo "escalation_reason=scm_pr_creation_failure" >> "$GITHUB_OUTPUT"
            fi
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --add-label "agent:actionable" \
              --add-label "triage/ready" \
              --add-label "agent:management-needed" \
              --add-label "agent:manual-review-needed" || true
            {
              echo "**Agent Work Loop** — PR creation failure after successful branch push."
              echo ""
              echo "- **Provider attempted:** $PROVIDER_USED"
              echo "- **Worker outcome:** $WORKER_OUTCOME"
              echo "- **PR create error kind:** $PR_CREATE_ERROR_KIND"
