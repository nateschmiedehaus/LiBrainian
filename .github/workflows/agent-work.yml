                echo "Automation routed this to management for workflow/instrumentation correction and retry."
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
            fi
          else
            echo "result=infra-failure" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "escalation_reason=outcome_inconsistent_state" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --remove-label "agent:needs-decomposition" \
              --add-label "agent:actionable" \
              --add-label "triage/ready" \
              --add-label "agent:management-needed" \
              --add-label "agent:manual-review-needed" || true
            {
              echo "**Agent Work Loop** — outcome state was not classifiable."
              echo ""
              echo "- **Run:** $RUN_URL"
              echo "- **Provider:** $PROVIDER_USED"
              echo "- **Worker/Gate outcomes:** $WORKER_OUTCOME / $GATE_OUTCOME"
              echo "- **Evidence status/source:** $EVIDENCE_STATUS / $EVIDENCE_SOURCE"
              echo ""
              echo "Automation escalated this to management for workflow-state correction and rerun."
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.find.outputs.issue_number }}
          PR: ${{ steps.create-pr.outputs.pr_number }}
          WORKER_OUTCOME: ${{ steps.worker.outputs.outcome }}
          PROVIDER_USED: ${{ steps.worker.outputs.provider_used }}
          PUSH_FAILED: ${{ steps.create-pr.outputs.push_failed }}
          PR_CREATE_FAILED: ${{ steps.create-pr.outputs.pr_create_failed }}
          PR_CREATE_ERROR_KIND: ${{ steps.create-pr.outputs.pr_create_error_kind }}
          GATE_OUTCOME: ${{ steps.gates.outcome }}
          EVIDENCE_FOUND: ${{ steps.evidence.outputs.found }}
          EVIDENCE_STATUS: ${{ steps.evidence.outputs.status }}
          EVIDENCE_SOURCE: ${{ steps.evidence.outputs.source }}
          NEXT_ACTION: ${{ steps.evidence.outputs.next_action }}
          ATTEMPTS: ${{ steps.strategy.outputs.attempts }}
          GATE_NO_CHANGES: ${{ steps.gates.outputs.no_changes }}
          GATE_COMMITS: ${{ steps.gates.outputs.commits }}
          GATE_CHANGED_COUNT: ${{ steps.gates.outputs.changed_count }}
          IS_MANAGEMENT: ${{ steps.find.outputs.issue_is_management }}
          HAS_CODEX_AVAILABLE: ${{ steps.provider.outputs.has_codex }}
          PROVIDER_PRIMARY: ${{ steps.provider.outputs.primary }}
          PROVIDER_FALLBACK: ${{ steps.provider.outputs.fallback }}
          BREAKER_OPEN: ${{ steps.breaker.outputs.open }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
          DEPS_BLOCKED: ${{ steps.deps.outputs.blocked }}
          RETRIES_SHELVED: ${{ steps.retries.outputs.shelved }}
          READINESS_READY: ${{ steps.readiness.outputs.ready }}
          READINESS_SCORE: ${{ steps.readiness.outputs.readiness_score }}
          STRATEGY_FOCUS: ${{ steps.strategy.outputs.focus }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_FAILED: ${{ steps.install-build.outputs.failed }}
          BUILD_FAILURE_KIND: ${{ steps.install-build.outputs.failure_kind }}
          CODEX_PRIMARY_TIMED_OUT: ${{ steps.agent-codex-primary.outputs.timed_out }}
          CODEX_FALLBACK_TIMED_OUT: ${{ steps.agent-codex-fallback.outputs.timed_out }}

      - name: Requeue on cancellation
        if: always() && steps.find.outputs.issue_number && job.status == 'cancelled'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          IS_MANAGEMENT=${{ steps.find.outputs.issue_is_management || 'false' }}
          HAS_CODEX_AVAILABLE=${{ steps.provider.outputs.has_codex || 'false' }}

          gh issue edit "$NUM" -R "$REPO" \
            --remove-label "agent:claimed" \
            --remove-label "verify:pending" \
            --add-label "triage/ready" || true
          if [ "$IS_MANAGEMENT" = "true" ]; then
            if [ "$HAS_CODEX_AVAILABLE" = "true" ]; then
              gh issue edit "$NUM" -R "$REPO" --add-label "agent:actionable" || true
            fi
          else
            gh issue edit "$NUM" -R "$REPO" --add-label "agent:actionable" || true
          fi
          {
            echo "**Agent Work Loop** run was cancelled before completion."
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Action:** issue returned to queue without infra/provider escalation."
          } > .cancelled-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .cancelled-comment.md || true
          rm -f .cancelled-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt PR-permission self-heal
        id: pr-perm-heal
        if: steps.outcome.outputs.escalation_reason == 'scm_pr_creation_permission' && steps.find.outputs.issue_number
        run: |
          NUM="${{ steps.find.outputs.issue_number }}"

          set +e
          gh api -X PUT "repos/$REPO/actions/permissions/workflow" \
            -f default_workflow_permissions=write \
            -F can_approve_pull_request_reviews=true >/tmp/pr-perm-heal.out 2>/tmp/pr-perm-heal.err
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "healed=true" >> "$GITHUB_OUTPUT"
            echo "Successfully enabled workflow write permissions and PR creation."
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:management-needed" \
              --remove-label "agent:manual-review-needed" \
              --remove-label "agent:infra-blocked" \
              --remove-label "agent:provider-auth-failure" \
              --add-label "triage/ready" \
              --add-label "agent:actionable" || true
            {
              echo "**Workflow self-heal** repaired Actions PR-creation permissions."
              echo ""
              echo "- Scope: \`actions/permissions/workflow\`"
              echo "- Result: set \`default_workflow_permissions=write\`, \`can_approve_pull_request_reviews=true\`"
              echo "- Next: continue autonomous chain."
            } > .pr-perm-heal-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .pr-perm-heal-comment.md || true
            rm -f .pr-perm-heal-comment.md
          else
            echo "healed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Unable to self-heal PR creation permissions."
            cat /tmp/pr-perm-heal.err || true
          fi

          rm -f /tmp/pr-perm-heal.out /tmp/pr-perm-heal.err
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Route escalation to management queue
        if: >-
          steps.outcome.outputs.escalate == 'true' &&
          steps.find.outputs.issue_number &&
          !(steps.outcome.outputs.escalation_reason == 'scm_pr_creation_permission' && steps.pr-perm-heal.outputs.healed == 'true')
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          IS_MANAGEMENT=${{ steps.find.outputs.issue_is_management || 'false' }}
          TITLE=$(echo "${{ steps.find.outputs.issue_title }}" | tr '\n' ' ' | tr '\r' ' ')
          TITLE_CLEAN=${TITLE//\"/\'}
          REASON=${{ steps.outcome.outputs.escalation_reason }}
          MILESTONE="${{ steps.find.outputs.issue_milestone || 'none' }}"
          HAS_CODEX_AVAILABLE=${{ steps.provider.outputs.has_codex || 'false' }}

          if [ "$IS_MANAGEMENT" = "true" ]; then
            MNUM="$NUM"
            {
              echo "**Workflow management routing (in-place)**"
              echo ""
              echo "- Escalation reason: \`$REASON\`"
              echo "- This issue is already a management ticket, so automation updated it in place."
            } > .management-link-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .management-link-comment.md
            rm -f .management-link-comment.md
            exit 0
          fi

          EXISTING=$(gh issue list -R "$REPO" --state open \
            --label "agent:management-ticket" \
            --limit 200 \
            --json number,title,body | jq -r --arg src "$NUM" '
              def src:
                ((try ((.body // "") | capture("source_issue=(?<n>[0-9]+)").n) catch null)
                 // (try ((.body // "") | capture("Source issue:\\s*#(?<n>[0-9]+)").n) catch null)
                 // (try ((.title // "") | capture("issue\\s*#(?<n>[0-9]+)").n) catch null)
                 // "");
              def queue:
                ((try ((.body // "") | capture("queue=(?<q>[a-z]+)").q) catch null)
                 // (if ((.title // "") | test("^meta:\\s*verify"; "i")) then "verify" else "work" end));
              .[] | select((src == $src) and (queue == "work")) | .number
            ' | head -n 1)

          cat > .management-body.md <<EOF
          ## Automated Management Queue Item
          <!-- management_ticket:v1 source_issue=$NUM queue=work reason=$REASON -->

          Source issue: #$NUM
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Escalation reason: $REASON
          Milestone: $MILESTONE

          ### Required management actions
          1. Diagnose why automation did not converge and choose one path: requirements patch, scope split, or infra repair.
          2. Update source issue #$NUM with concrete acceptance criteria and explicit file-level plan.
          3. Remove \`agent:manual-review-needed\` and re-add \`agent:actionable\` only when the issue is truly runnable.
          4. Close this management ticket once #$NUM is unblocked and re-queued.
          EOF

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" -R "$REPO" --body-file .management-body.md
            if [ "$REASON" = "provider_auth_or_runtime_failure" ]; then
              if [ "$HAS_CODEX_AVAILABLE" = "true" ]; then
                gh issue edit "$EXISTING" -R "$REPO" \
                  --add-label "agent:management-ticket" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed" \
                  --add-label "agent:infra-blocked" \
                  --add-label "agent:provider-auth-failure" \
                  --add-label "triage/ready" \
                  --add-label "agent:actionable" || true
              else
                gh issue edit "$EXISTING" -R "$REPO" \
                  --remove-label "agent:actionable" \
                  --add-label "agent:management-ticket" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed" \
                  --add-label "agent:infra-blocked" \
                  --add-label "agent:provider-auth-failure" \
                  --add-label "triage/ready" || true
              fi
            fi
            MNUM="$EXISTING"
          else
            CREATE_ARGS=()
            if [ "$MILESTONE" != "none" ] && [ -n "$MILESTONE" ]; then
              CREATE_ARGS+=(--milestone "$MILESTONE")
            fi

            if [ "$REASON" = "provider_auth_or_runtime_failure" ]; then
              if [ "$HAS_CODEX_AVAILABLE" = "true" ]; then
                CREATE_ARGS+=(--label "agent:infra-blocked")
                CREATE_ARGS+=(--label "agent:provider-auth-failure")
                CREATE_ARGS+=(--label "agent:manual-review-needed")
                CREATE_ARGS+=(--label "agent:actionable")
              else
                CREATE_ARGS+=(--label "agent:infra-blocked")
                CREATE_ARGS+=(--label "agent:provider-auth-failure")
                CREATE_ARGS+=(--label "agent:manual-review-needed")
              fi
            else
              CREATE_ARGS+=(--label "agent:actionable")
            fi

            MURL=$(gh issue create -R "$REPO" \
              --title "meta: manage issue #$NUM — $TITLE_CLEAN" \
              --body-file .management-body.md \
              --label "agent:management-ticket" \
              --label "agent:management-needed" \
              --label "triage/ready" \
              "${CREATE_ARGS[@]}")
            MNUM=$(echo "$MURL" | grep -oE '[0-9]+$')
          fi
          rm -f .management-body.md

          {
            echo "**Workflow management routing**"
            echo ""
            echo "- Escalation reason: \`$REASON\`"
            echo "- Management item: #$MNUM"
            echo ""
            echo "This was generated automatically to prevent endless fallback/retry loops."
          } > .management-link-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .management-link-comment.md
          rm -f .management-link-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close resolved management queue items
        if: steps.outcome.outputs.result == 'success' && steps.find.outputs.issue_number
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          MGMT_IDS=$(gh issue list -R "$REPO" --state open \
            --label "agent:management-ticket" \
            --limit 200 \
            --json number,title,body | jq -r --arg src "$NUM" '
              def src:
                ((try ((.body // "") | capture("source_issue=(?<n>[0-9]+)").n) catch null)
                 // (try ((.body // "") | capture("Source issue:\\s*#(?<n>[0-9]+)").n) catch null)
                 // (try ((.title // "") | capture("issue\\s*#(?<n>[0-9]+)").n) catch null)
                 // "");
              def queue:
                ((try ((.body // "") | capture("queue=(?<q>[a-z]+)").q) catch null)
                 // (if ((.title // "") | test("^meta:\\s*verify"; "i")) then "verify" else "work" end));
              .[] | select((src == $src) and (queue == "work")) | .number
            ')
          if [ -z "$MGMT_IDS" ]; then
            exit 0
          fi
          for MID in $MGMT_IDS; do
            if [ "$MID" = "$NUM" ]; then
              continue
            fi
            gh issue close "$MID" -R "$REPO" \
              --comment "Auto-closing management ticket: source issue #$NUM produced a PR in run ${{ github.run_id }}."
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unclaim on failure
        if: failure() && steps.find.outputs.issue_number && steps.outcome.outputs.result == ''
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          gh issue edit "$NUM" -R "$REPO" \
            --remove-label "agent:claimed" \
            --remove-label "verify:pending"
          {
            echo "**Agent Work Loop** failed."
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Error:** Workflow failed — check run logs"
            echo ""
            echo "Returning to ready state for retry."
            echo ""
            echo "<!-- agent_evidence = {\"v\":1,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"${{ github.run_id }}\",\"status\":\"failed\"} -->"
          } > .failure-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .failure-comment.md
          rm -f .failure-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regular verify dispatch for pending backlog
        if: always() && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          ENABLE_FALLBACK_INPUT="${{ inputs.enable_fallback }}"
          VERIFY_FALLBACK=true
          if [ "$ENABLE_FALLBACK_INPUT" = "false" ] || [ "$ENABLE_FALLBACK_INPUT" = "0" ]; then
            VERIFY_FALLBACK=false
          fi

          VERIFY_PENDING=$(gh issue list -R "$REPO" --state open \
            --label "verify:pending" \
            --limit 200 \
            --json number --jq 'length')
          if [ "$VERIFY_PENDING" -le 0 ]; then
            echo "No verify backlog."
            exit 0
          fi

          ACTIVE_VERIFY=$(gh run list -R "$REPO" -w "Agent Verify Loop" --limit 20 \
            --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$ACTIVE_VERIFY" -gt 0 ]; then
            echo "Verify backlog=$VERIFY_PENDING, but verify workflow already active ($ACTIVE_VERIFY run(s)); skipping dispatch."
            exit 0
          fi

          gh workflow run agent-verify.yml -R "$REPO" \
            -f agent_provider="auto" \
            -f enable_fallback="$VERIFY_FALLBACK" \
            -f batch_remaining="${VERIFY_DRAIN_BATCH}"

          echo "Dispatched Agent Verify Loop for backlog drain (pending=$VERIFY_PENDING, batch=${VERIFY_DRAIN_BATCH})."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Chain next autonomous run
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          ISSUE_NUM="${{ steps.find.outputs.issue_number || '' }}"
          OUTCOME="${{ steps.outcome.outputs.result || '' }}"
          ESC_REASON="${{ steps.outcome.outputs.escalation_reason || '' }}"
          PR_PERMISSION_HEALED="${{ steps.pr-perm-heal.outputs.healed || 'false' }}"
          HAS_CODEX_AVAILABLE="${{ steps.provider.outputs.has_codex || 'false' }}"
          REMAINING="${{ inputs.batch_remaining || '1' }}"
          ENABLE_FALLBACK_INPUT="${{ inputs.enable_fallback }}"
          NEXT_ENABLE_FALLBACK=true
          if [ "$ENABLE_FALLBACK_INPUT" = "false" ] || [ "$ENABLE_FALLBACK_INPUT" = "0" ]; then
            NEXT_ENABLE_FALLBACK=false
          fi
          if ! [[ "$REMAINING" =~ ^[0-9]+$ ]]; then
            echo "batch_remaining is not numeric; stopping chain."
            exit 0
          fi
          if [ "$REMAINING" -le 1 ]; then
            echo "Batch chain complete (remaining=$REMAINING)."
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run enabled; not chaining."
            exit 0
          fi
          if [ "${{ steps.breaker.outputs.open }}" = "true" ]; then
            echo "Circuit breaker open; not chaining."
            exit 0
          fi
          if [ -z "$ISSUE_NUM" ]; then
            VERIFY_PENDING=$(gh issue list -R "$REPO" --state open \
              --label "verify:pending" \
              --limit 200 \
              --json number --jq 'length')
            if [ "$VERIFY_PENDING" -le 0 ]; then
              echo "No issue selected and no verify backlog; stopping chain."
              exit 0
            fi
            echo "No work issue selected; verify backlog still present ($VERIFY_PENDING). Continuing autonomous chain."
          fi
          if [ "$OUTCOME" = "infra-failure" ] || [ "$ESC_REASON" = "provider_or_infra_failure" ] || [ "$ESC_REASON" = "provider_auth_or_runtime_failure" ]; then
            if [ "$ESC_REASON" = "scm_pr_creation_permission" ] && [ "$PR_PERMISSION_HEALED" = "true" ]; then
              echo "PR-creation permission issue was auto-healed; continuing chain."
            elif [ "$HAS_CODEX_AVAILABLE" = "true" ]; then
              echo "Infra/provider escalation detected, but Codex is available; continuing chain for autonomous management recovery."
            else
              echo "Provider/infra failure detected; pausing autonomous chain to avoid bulk infra escalations."
              exit 0
            fi
          fi

          NEXT=$((REMAINING - 1))
          echo "Dispatching chained run with batch_remaining=$NEXT"
          gh workflow run agent-work.yml -R "$REPO" \
            -f agent_provider="${{ inputs.agent_provider || 'auto' }}" \
            -f enable_fallback="$NEXT_ENABLE_FALLBACK" \
            -f dry_run=false \
            -f max_turns="${{ inputs.max_turns || env.DEFAULT_MAX_TURNS }}" \
            -f batch_remaining="$NEXT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
