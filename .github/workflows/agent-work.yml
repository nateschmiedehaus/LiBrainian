                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"non_convergent\",\"managerial_fix\":\"timeout_strategy_patch\",\"next_action\":\"manual_review\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
            else
              echo "result=retry-infra" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=worker_timeout_transient" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --remove-label "agent:management-needed" \
                --remove-label "agent:manual-review-needed" \
                --remove-label "agent:infra-blocked" \
                --add-label "agent:actionable" \
                --add-label "triage/ready" || true
              {
                echo "**Agent Work Loop** — worker timed out."
                echo ""
                echo "- **Provider attempted:** $PROVIDER_USED"
                echo "- **Attempts:** $ATTEMPTS"
                echo "- **Timeout signals:** codex_primary=$CODEX_PRIMARY_TIMED_OUT, codex_fallback=$CODEX_FALLBACK_TIMED_OUT"
                echo ""
                echo "Issue was automatically re-queued for another attempt with updated strategy."
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"timeout_strategy_patch\",\"next_action\":\"retry\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
            fi
          elif [ "$WORKER_OUTCOME" != "success" ]; then
            echo "result=infra-failure" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            if [ "$CLAUDE_AUTH_HINT" = "true" ]; then
              echo "escalation_reason=provider_auth_or_runtime_failure" >> "$GITHUB_OUTPUT"
            else
              echo "escalation_reason=provider_or_infra_failure" >> "$GITHUB_OUTPUT"
            fi
            if [ "$IS_MANAGEMENT" = "true" ]; then
              if [ "$CLAUDE_AUTH_HINT" = "true" ]; then
                if [ "$HAS_CODEX_AVAILABLE" = "true" ]; then
                  gh issue edit "$NUM" -R "$REPO" \
                    --remove-label "agent:claimed" \
                    --remove-label "verify:pending" \
                    --remove-label "agent:needs-recovery" \
                    --remove-label "triage/missing-essentials" \
                    --add-label "agent:actionable" \
                    --add-label "triage/ready" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed"
                else
                  gh issue edit "$NUM" -R "$REPO" \
                    --remove-label "agent:claimed" \
                    --remove-label "verify:pending" \
                    --remove-label "agent:needs-recovery" \
                    --remove-label "triage/missing-essentials" \
                    --remove-label "agent:actionable" \
                    --add-label "triage/ready" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed"
                fi
              else
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:claimed" \
                  --remove-label "verify:pending" \
                  --remove-label "agent:needs-recovery" \
                  --remove-label "triage/missing-essentials" \
                  --remove-label "agent:provider-auth-failure" \
                  --add-label "agent:actionable" \
                  --add-label "triage/ready" \
                  --add-label "agent:infra-blocked" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed"
              fi
            else
              if [ "$CLAUDE_AUTH_HINT" = "true" ]; then
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:claimed" \
                  --remove-label "verify:pending" \
                  --remove-label "agent:actionable" \
                  --add-label "agent:infra-blocked" \
                  --add-label "agent:provider-auth-failure" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed"
              else
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:claimed" \
                  --remove-label "verify:pending" \
                  --remove-label "agent:actionable" \
                  --remove-label "agent:provider-auth-failure" \
                  --add-label "agent:infra-blocked" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed"
              fi
            fi
            {
              echo "**Agent Work Loop** — provider/infra failure."
              echo ""
              echo "- **Provider attempted:** $PROVIDER_USED"
              echo "- **Primary/Fallback plan:** $PROVIDER_PRIMARY / ${PROVIDER_FALLBACK:-none}"
              echo "- **Worker outcome:** $WORKER_OUTCOME"
              echo "- **Detected auth/access failure hint:** $CLAUDE_AUTH_HINT"
              if [ "$IS_MANAGEMENT" = "true" ] && [ "$CLAUDE_AUTH_HINT" = "true" ] && [ "$HAS_CODEX_AVAILABLE" != "true" ]; then
                echo "- **Queue behavior:** parked this management ticket until provider credentials are repaired (no Codex fallback available)."
              fi
              echo ""
              echo "Action needed:"
              echo "1. Workflow created/updated a management queue item automatically."
              echo "2. Restore provider credentials or CI environment health."
              echo "   - If Claude reports 401/authentication_error, refresh \`CLAUDE_CODE_OAUTH_TOKEN\`."
              echo "   - If Codex is used, verify \`CODEX_AUTH_JSON\` (OAuth) or \`OPENAI_API_KEY\`."
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"manual_review\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          elif [ "$GATE_OUTCOME" != "success" ]; then
            echo "result=quality-failed" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --add-label "verify:fail" \
              --add-label "agent:actionable"
            if [ "$ATTEMPTS" -ge 3 ]; then
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=quality_nonconvergent" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --add-label "agent:management-needed" \
                --add-label "agent:manual-review-needed"
            fi
            {
              echo "**Agent Work Loop** — post-agent quality gates failed."
              echo ""
              echo "- **Provider:** $PROVIDER_USED"
              echo "- **Evidence metadata found:** $EVIDENCE_FOUND"
              echo "- **Evidence status:** $EVIDENCE_STATUS"
              echo "- **Attempts:** $ATTEMPTS"
              echo ""
              echo "This issue remains actionable for rework. Next run should focus on failing gates."
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"test_plan_patch\",\"next_action\":\"retry\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          elif [ "$WORKER_OUTCOME" = "success" ] && [ "$GATE_OUTCOME" = "success" ] && [ -z "$PR" ] && [ "$PUSH_FAILED" != "true" ]; then
            if [ "$IS_MANAGEMENT" = "true" ]; then
              MBODY=$(gh issue view "$NUM" -R "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo "")
              SRC=$(echo "$MBODY" | grep -ioE 'source issue:\s*#[0-9]+' | grep -oE '[0-9]+' | head -n1)
              if [ -z "$SRC" ]; then
                SRC=$(echo "$MBODY" | grep -oE 'source_issue=[0-9]+' | grep -oE '[0-9]+' | head -n1)
              fi

              SHOULD_CLOSE=false
              CLOSE_REASON="management_applied"
              if [ -n "$SRC" ]; then
                SJSON=$(gh issue view "$SRC" -R "$REPO" --json state,labels 2>/dev/null || true)
                if [ -n "$SJSON" ] && [ "$SJSON" != "null" ]; then
                  SSTATE=$(echo "$SJSON" | jq -r '.state // "OPEN"')
                  if [ "$SSTATE" = "CLOSED" ]; then
                    SHOULD_CLOSE=true
                    CLOSE_REASON="source_closed"
                  else
                    SLABELS=$(echo "$SJSON" | jq -r '.labels[].name')
                    if ! echo "$SLABELS" | grep -Fxq "agent:management-needed" && ! echo "$SLABELS" | grep -Fxq "verify:manual-needed"; then
                      SHOULD_CLOSE=true
                      CLOSE_REASON="source_unblocked"
                    fi
                  fi
                fi
              fi

              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --add-label "triage/ready" \
                --add-label "agent:actionable" || true

              if [ "$SHOULD_CLOSE" = "true" ]; then
                gh issue close "$NUM" -R "$REPO" \
                  --comment "Auto-closing management ticket after successful management run ($CLOSE_REASON)." || true
              fi

              {
                echo "**Agent Work Loop** completed management actions."
                echo ""
                echo "- **Provider:** $PROVIDER_USED"
                echo "- **Management ticket:** #$NUM"
                if [ -n "$SRC" ]; then
                  echo "- **Source issue:** #$SRC"
