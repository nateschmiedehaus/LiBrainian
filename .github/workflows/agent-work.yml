name: Agent Work Loop

# Autonomous issue implementation loop.
# Finds the highest-priority ready issue, dispatches a Claude agent to implement it,
# creates a PR, and labels the issue for verification.
#
# Auth: Requires CLAUDE_CODE_OAUTH_TOKEN (Max subscription OAuth) in repo secrets.
# Codex can authenticate via CODEX_AUTH_JSON (preferred OAuth auth.json payload)
# or OPENAI_API_KEY.

on:
  schedule:
    - cron: '5,35 * * * *'  # Every 30 minutes
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number to work on (blank = auto-select)'
        required: false
        default: ''
        type: string
      agent_provider:
        description: 'Agent provider (auto = Claude first, then Codex fallback)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - claude
          - codex
      enable_fallback:
        description: 'Allow automatic provider fallback when primary fails'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run — find issue but do not dispatch agent'
        required: false
        default: false
        type: boolean
      max_turns:
        description: 'Max agent turns (default 35)'
        required: false
        default: '35'
        type: string
      batch_remaining:
        description: 'Autonomous sequential run budget (1 = single run, 15 = run 15 issues sequentially)'
        required: false
        default: '1'
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Only one work loop at a time. New triggers queue (don't cancel in-progress work).
concurrency:
  group: agent-work-loop
  cancel-in-progress: false

env:
  REPO: nateschmiedehaus/LiBrainian
  # Circuit breaker: stop dispatching if recent runs keep failing
  MAX_CONSECUTIVE_FAILURES: 3
  MAX_ISSUE_ATTEMPTS: 5
  DEFAULT_MAX_TURNS: 35
  LONG_RUN_THRESHOLD: 55
  RECENT_INFRA_WINDOW_MIN: 90
  MAX_RECENT_INFRA_BLOCKED: 2
  PROVIDER_RETRY_COOLDOWN_MIN: 180
  CODEX_WORKER_TIMEOUT_MIN: 45
  MANAGEMENT_CODEX_WORKER_TIMEOUT_MIN: 25
  CLAUDE_WORKER_TIMEOUT_MIN: 45
  WORKER_HEARTBEAT_SEC: 120
  VERIFY_DRAIN_BATCH: 3
  MAX_MANAGEMENT_PASS_PER_RUN: 15

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      issue_number: ${{ steps.find.outputs.issue_number }}
      issue_title: ${{ steps.find.outputs.issue_title }}
      issue_milestone: ${{ steps.find.outputs.issue_milestone }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      branch: ${{ steps.branch.outputs.name }}
      outcome: ${{ steps.outcome.outputs.result }}

    steps:
      # ── Circuit Breaker ──────────────────────────────────────────────
      # Counts CONSECUTIVE failures from the most recent run backwards.
      # One success auto-clears the breaker — no manual intervention needed.
      - name: Circuit breaker — check consecutive failures
        id: breaker
        run: |
          CONSECUTIVE=0
          for CONC in $(gh run list -R "$REPO" -w "Agent Work Loop" --limit 10 \
            --json conclusion --jq '.[].conclusion'); do
            if [ "$CONC" = "failure" ]; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
            else
              break
            fi
          done

          if [ "$CONSECUTIVE" -ge "$MAX_CONSECUTIVE_FAILURES" ]; then
            echo "Circuit breaker OPEN — $CONSECUTIVE consecutive failures."

            # Auto-heal check: if workflow files changed after the last failure,
            # the fix is likely deployed — force the breaker closed
            LAST_FAIL_TIME=$(gh run list -R "$REPO" -w "Agent Work Loop" --limit 1 \
              --json conclusion,updatedAt --jq '.[0] | select(.conclusion == "failure") | .updatedAt' || true)
            LAST_WORKFLOW_CHANGE=$(gh api "repos/$REPO/commits?path=.github/workflows/agent-work.yml&per_page=1" \
              --jq '.[0].commit.committer.date' 2>/dev/null || true)

            if [ -n "$LAST_FAIL_TIME" ] && [ -n "$LAST_WORKFLOW_CHANGE" ]; then
              if [[ "$LAST_WORKFLOW_CHANGE" > "$LAST_FAIL_TIME" ]]; then
                echo "Auto-heal: workflow changed after last failure ($LAST_WORKFLOW_CHANGE > $LAST_FAIL_TIME). Resetting breaker."
                echo "open=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Circuit breaker closed ($CONSECUTIVE consecutive failures)"
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if circuit breaker open
        if: steps.breaker.outputs.open == 'true'
        run: |
          echo "::warning::Circuit breaker is open — ${{ env.MAX_CONSECUTIVE_FAILURES }} consecutive failures. Will auto-heal when workflow is updated."
          exit 0

      - name: Infra incident gate
        id: infra-gate
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            echo "Manual issue override detected; skipping infra incident gate."
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HAS_CODEX=false
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            HAS_CODEX=true
          fi

          CUTOFF=$(date -u -d "${RECENT_INFRA_WINDOW_MIN} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')
          RECENT_INFRA_RAW=$(gh issue list -R "$REPO" --state open \
            --label "agent:infra-blocked" \
            --search "updated:>=$CUTOFF -label:agent:management-ticket" \
            --limit 200 \
            --json number,labels)

          if [ "$HAS_CODEX" = "true" ]; then
            # When Codex is available, provider-auth-only incidents are not infra blockers.
            RECENT_INFRA=$(echo "$RECENT_INFRA_RAW" | jq '[.[] | select((.labels | map(.name) | contains(["agent:provider-auth-failure"])) | not)] | length')
          else
            RECENT_INFRA=$(echo "$RECENT_INFRA_RAW" | jq 'length')
          fi

          echo "Recent infra-blocked issues in last ${RECENT_INFRA_WINDOW_MIN}m: $RECENT_INFRA"
          if [ "$RECENT_INFRA" -ge "$MAX_RECENT_INFRA_BLOCKED" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Abort if infra incident gate open
        if: steps.infra-gate.outputs.open == 'true'
        run: |
          echo "::warning::Infra incident gate open — recent provider/infra failures detected."
          echo "::warning::Worker issue selection is paused to avoid broad churn; management/meta maintenance will continue."
          echo "::warning::Auto-heal: gate closes when infra-blocked updates are quiet for ${RECENT_INFRA_WINDOW_MIN} minutes or when manually targeting an issue."
          exit 0

      - name: Provider auth incident gate
        id: provider-auth-gate
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            echo "Manual issue override detected; skipping provider auth incident gate."
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            echo "Codex credentials are available (OPENAI_API_KEY or CODEX_AUTH_JSON); provider auth incident gate disabled."
            echo "open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OPEN_INCIDENTS=$(gh issue list -R "$REPO" --state open \
            --label "agent:credential-incident" \
            --limit 20 \
            --json number --jq 'length')
          if [ "$OPEN_INCIDENTS" -ge 1 ]; then
            echo "Open credential incident issue(s) detected: $OPEN_INCIDENTS"
            echo "open=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CUTOFF=$(date -u -d "${RECENT_INFRA_WINDOW_MIN} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')
          RECENT_AUTH=$(gh issue list -R "$REPO" --state open \
            --label "agent:provider-auth-failure" \
            --search "updated:>=$CUTOFF -label:agent:management-ticket" \
            --limit 200 \
            --json number --jq 'length')

          echo "Recent provider-auth-failure source issues in last ${RECENT_INFRA_WINDOW_MIN}m: $RECENT_AUTH"
          if [ "$RECENT_AUTH" -ge 1 ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Abort if provider auth incident gate open
        if: steps.provider-auth-gate.outputs.open == 'true'
        run: |
          echo "::warning::Provider auth incident gate open — recent auth failures detected and Codex credentials are unavailable."
          echo "::warning::Worker issue selection is paused to avoid repeated provider-auth failures; management/meta maintenance will continue."
          echo "::warning::Auto-heal: gate closes after auth-failure issues are quiet for ${RECENT_INFRA_WINDOW_MIN} minutes or Codex credentials become available."
          exit 0

      - name: Ensure adaptive labels exist
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          ensure_label() {
            local name="$1"
            local color="$2"
            local desc="$3"
            if ! gh label list -R "$REPO" --limit 500 --json name --jq '.[].name' | grep -Fxq "$name"; then
              gh label create "$name" -R "$REPO" --color "$color" --description "$desc" || true
            fi
          }

          ensure_label "agent:needs-decomposition" "D73A4A" "Issue repeatedly failed automation and needs scope split"
          ensure_label "agent:needs-recovery" "FBCA04" "Issue requires recovery path; automation continues via management and dependency resolution"
          ensure_label "agent:infra-blocked" "A29BFE" "Automation blocked by provider/auth/infra failures"
          ensure_label "agent:provider-auth-failure" "B60205" "Recent provider auth/runtime failure signal; prefer alternate provider when available"
          ensure_label "agent:management-needed" "1D76DB" "Automation escalated this issue into management queue"
          ensure_label "agent:management-ticket" "5319E7" "Synthetic management issue generated by automation"
          ensure_label "agent:management-malformed" "C2E0C6" "Management ticket is missing required source issue metadata"
          ensure_label "agent:manual-review-needed" "B60205" "Strategic management review required before retry (handled by agent workflow)"
          ensure_label "agent:credential-incident" "7A2B8F" "Repository-level provider credential incident tracked by workflow"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Migrate legacy blocked label to needs-recovery
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          LEGACY=$(gh issue list -R "$REPO" --state open --label "agent:blocked" --limit 200 --json number --jq '.[].number')
          if [ -z "$LEGACY" ]; then
            echo "No legacy agent:blocked labels to migrate."
            exit 0
          fi
          for NUM in $LEGACY; do
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:blocked" \
              --add-label "agent:needs-recovery" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Track provider credential incident
        if: steps.provider-auth-gate.conclusion == 'success' && steps.provider-auth-gate.outputs.open == 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          TITLE="meta: repair provider credentials for autonomous workers"
          EXISTING=$(gh issue list -R "$REPO" --state open \
            --label "agent:credential-incident" \
            --limit 20 \
            --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          cat > .credential-incident-body.md <<EOF
          ## Provider Credential Incident

          This repository is currently blocked by provider authentication failures.

          - Gate: provider-auth incident gate is open
          - Scope: autonomous worker dispatch is paused until credentials recover

          ### Required actions
          1. Refresh \`CLAUDE_CODE_OAUTH_TOKEN\` (or remove it if intentionally disabled).
          2. Configure \`CODEX_AUTH_JSON\` (preferred OAuth) or \`OPENAI_API_KEY\` to allow Codex fallback.
          3. Trigger \`agent-work.yml\` after credentials are repaired and verify gate closure.
          EOF

          if [ -n "$EXISTING" ]; then
            CURRENT_BODY=$(gh issue view "$EXISTING" -R "$REPO" --json body --jq '.body // ""' 2>/dev/null || echo "")
            NEW_BODY=$(cat .credential-incident-body.md)
            if [ "$CURRENT_BODY" != "$NEW_BODY" ]; then
              gh issue edit "$EXISTING" -R "$REPO" --body-file .credential-incident-body.md || true
            fi
          else
            gh issue create -R "$REPO" \
              --title "$TITLE" \
              --body-file .credential-incident-body.md \
              --label "agent:credential-incident" \
              --label "agent:management-needed" \
              --label "triage/ready" \
              --milestone "M0: Dogfood-Ready" || true
          fi
          rm -f .credential-incident-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close provider credential incident when recovered
        if: >-
          steps.breaker.outputs.open != 'true' &&
          steps.provider-auth-gate.conclusion == 'success' &&
          steps.provider-auth-gate.outputs.open != 'true' &&
          inputs.issue_number == '' &&
          inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          INCIDENTS=$(gh issue list -R "$REPO" --state open \
            --label "agent:credential-incident" \
            --limit 20 \
            --json number,title \
            --jq '.[] | .number')
          if [ -z "$INCIDENTS" ]; then
            exit 0
          fi

          for NUM in $INCIDENTS; do
            gh issue close "$NUM" -R "$REPO" \
              --comment "Auto-closing credential incident: provider-auth gate is no longer open in run ${{ github.run_id }}." || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backfill provider auth-failure hints from issue history
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          MAX_SCAN=80
          PROCESSED=0
          UPDATED=0
          CANDIDATES=$(gh issue list -R "$REPO" --state open \
            --label "agent:infra-blocked" \
            --limit 200 \
            --json number,labels \
            --jq '.[] | select((.labels | map(.name) | contains(["agent:provider-auth-failure"]) | not)) | .number' | head -n "$MAX_SCAN")

          if [ -z "$CANDIDATES" ]; then
            echo "Provider auth hint backfill: no unlabeled infra-blocked issues."
            exit 0
          fi

          for NUM in $CANDIDATES; do
            PROCESSED=$((PROCESSED + 1))
            COMMENTS=$(gh issue view "$NUM" -R "$REPO" --json comments \
              --jq '.comments[-30:] | .[].body // ""' 2>/dev/null || echo "")
            if echo "$COMMENTS" | grep -Eiq 'provider_auth_or_runtime_failure|authentication_error|OAuth token has expired'; then
              gh issue edit "$NUM" -R "$REPO" \
                --add-label "agent:provider-auth-failure" \
                --add-label "agent:manual-review-needed" || true
              UPDATED=$((UPDATED + 1))
            fi
          done

          echo "Provider auth hint backfill summary: processed=$PROCESSED updated=$UPDATED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assess source throughput health
        id: throughput
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          ACTIVE_MILESTONE=$(gh issue list -R "$REPO" --state open --limit 500 \
            --json milestone,labels | jq -r '
              [.[] |
                select((.labels | map(.name) | contains(["agent:management-ticket"]) | not)) |
                (.milestone.title // empty) |
                select(. != "") |
                {title: ., order: (
                  if . == "M0: Dogfood-Ready" then 0
                  elif . == "M1: Construction MVP" then 1
                  elif . == "M2: Agent Integration" then 2
                  elif . == "M3: Scale & Epistemics" then 3
                  elif . == "M4: World-Class" then 4
                  else 99 end
                )}
              ] | sort_by(.order, .title) | first | .title // "none"
            ')

          if [ "$ACTIVE_MILESTONE" = "none" ]; then
            echo "active_milestone=none" >> "$GITHUB_OUTPUT"
            echo "runnable_source=0" >> "$GITHUB_OUTPUT"
            echo "closed_source_24h=0" >> "$GITHUB_OUTPUT"
            echo "source_starved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNNABLE_SOURCE=$(gh issue list -R "$REPO" --state open \
            --label "triage/ready" --label "agent:actionable" \
            --limit 300 \
            --json number,milestone,labels | jq -r --arg m "$ACTIVE_MILESTONE" '
              [
                .[] |
                select((.milestone.title // "none") == $m) |
                select((.labels | map(.name) | contains(["agent:management-ticket"]) | not)) |
                select((.labels | map(.name) | contains(["agent:claimed"]) | not)) |
                select((.labels | map(.name) | contains(["lifecycle/frozen"]) | not)) |
                select((.labels | map(.name) | contains(["triage/missing-essentials"]) | not)) |
                select((.labels | map(.name) | contains(["agent:needs-recovery"]) | not)) |
                select((.labels | map(.name) | contains(["verify:pending"]) | not)) |
                select((.labels | map(.name) | contains(["agent:infra-blocked"]) | not))
              ] | length
            ')

          CUTOFF=$(date -u -d "24 hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          CLOSED_SOURCE_24H=$(gh issue list -R "$REPO" --state closed \
            --search "closed:>=$CUTOFF -label:agent:management-ticket" \
            --limit 300 \
            --json number,milestone | jq -r --arg m "$ACTIVE_MILESTONE" '
              [.[] | select((.milestone.title // "none") == $m)] | length
            ')

          STARVED=false
          if [ "$RUNNABLE_SOURCE" -ge 1 ] && [ "$CLOSED_SOURCE_24H" -eq 0 ]; then
            STARVED=true
          fi

          echo "active_milestone=$ACTIVE_MILESTONE" >> "$GITHUB_OUTPUT"
          echo "runnable_source=$RUNNABLE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "closed_source_24h=$CLOSED_SOURCE_24H" >> "$GITHUB_OUTPUT"
          echo "source_starved=$STARVED" >> "$GITHUB_OUTPUT"
          echo "Throughput health: milestone=$ACTIVE_MILESTONE runnable_source=$RUNNABLE_SOURCE closed_source_24h=$CLOSED_SOURCE_24H source_starved=$STARVED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Self-heal management ticket coverage
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          MAX_REPAIR_PER_RUN=12
          if [ "${{ steps.throughput.outputs.source_starved || 'false' }}" = "true" ]; then
            MAX_REPAIR_PER_RUN=6
          fi
          PROCESSED=0
          RELABELED=0
          CREATED=0
          HAS_CODEX=false
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            HAS_CODEX=true
          fi
          GLOBAL_AUTH_GATE_OPEN="${{ steps.provider-auth-gate.outputs.open || 'false' }}"

          has_label() {
            local labels="$1"
            local label="$2"
            echo "$labels" | grep -Fxq "$label"
          }

          CANDIDATES=$(gh issue list -R "$REPO" --state open \
            --label "agent:management-needed" \
            --limit 200 \
            --json number,title,labels \
            --jq '.[] | @base64')

          if [ -z "$CANDIDATES" ]; then
            echo "Management ticket heal: no management-needed issues."
            exit 0
          fi

          for ROW in $CANDIDATES; do
            if [ "$PROCESSED" -ge "$MAX_REPAIR_PER_RUN" ]; then
              break
            fi
            PROCESSED=$((PROCESSED + 1))

            ITEM=$(echo "$ROW" | base64 --decode)
            NUM=$(echo "$ITEM" | jq -r '.number')
            TITLE=$(echo "$ITEM" | jq -r '.title // ""')
            LABELS=$(echo "$ITEM" | jq -r '.labels[].name')

            # If source issue is already runnable, remove stale management-needed
            # instead of spawning another management ticket.
            if ! has_label "$LABELS" "agent:management-ticket"; then
              if has_label "$LABELS" "agent:actionable" &&
                 has_label "$LABELS" "triage/ready" &&
                 ! has_label "$LABELS" "triage/missing-essentials" &&
                 ! has_label "$LABELS" "agent:needs-decomposition" &&
                 ! has_label "$LABELS" "agent:manual-review-needed" &&
                 ! has_label "$LABELS" "agent:needs-recovery" &&
                 ! has_label "$LABELS" "agent:infra-blocked" &&
                 ! has_label "$LABELS" "verify:manual-needed" &&
                 ! has_label "$LABELS" "verify:pending"; then
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:management-needed" || true
                RELABELED=$((RELABELED + 1))
                continue
              fi
            fi

            if has_label "$LABELS" "agent:management-ticket"; then
              if [ "$GLOBAL_AUTH_GATE_OPEN" = "true" ] && [ "$HAS_CODEX" != "true" ]; then
                if has_label "$LABELS" "agent:actionable"; then
                  gh issue edit "$NUM" -R "$REPO" \
                    --remove-label "agent:actionable" \
                    --add-label "triage/ready" || true
                  RELABELED=$((RELABELED + 1))
                fi
                continue
              fi
              if has_label "$LABELS" "agent:needs-recovery"; then
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:needs-recovery" \
                  --remove-label "triage/missing-essentials" \
                  --add-label "triage/ready" || true
                RELABELED=$((RELABELED + 1))
              fi
              if has_label "$LABELS" "agent:infra-blocked"; then
                if has_label "$LABELS" "agent:actionable" || ! has_label "$LABELS" "triage/ready"; then
                  gh issue edit "$NUM" -R "$REPO" \
                    --remove-label "agent:actionable" \
                    --add-label "triage/ready" || true
                  RELABELED=$((RELABELED + 1))
                fi
              elif ! has_label "$LABELS" "agent:actionable"; then
                gh issue edit "$NUM" -R "$REPO" \
                  --add-label "agent:actionable" \
                  --add-label "triage/ready" || true
                RELABELED=$((RELABELED + 1))
              fi
              continue
            fi

            if echo "$TITLE" | grep -Eiq '^meta:\s*(manage|verify)\s*issue\s*#[0-9]+'; then
              gh issue edit "$NUM" -R "$REPO" --add-label "agent:management-ticket" || true
              RELABELED=$((RELABELED + 1))
              continue
            fi

            SRC="$NUM"
            EXISTING=$(gh issue list -R "$REPO" --state open \
              --label "agent:management-ticket" \
              --limit 200 \
              --json number,title,body | jq -r --arg src "$SRC" '
                def src:
                  ((try ((.body // "") | capture("source_issue=(?<n>[0-9]+)").n) catch null)
                   // (try ((.body // "") | capture("Source issue:\\s*#(?<n>[0-9]+)").n) catch null)
                   // (try ((.title // "") | capture("issue\\s*#(?<n>[0-9]+)").n) catch null)
                   // "");
                def queue:
                  ((try ((.body // "") | capture("queue=(?<q>[a-z]+)").q) catch null)
                   // (if ((.title // "") | test("^meta:\\s*verify"; "i")) then "verify" else "work" end));
                .[] | select((src == $src) and (queue == "work")) | .number
              ' | head -n1)
            if [ -n "$EXISTING" ]; then
              continue
            fi

            REASON="management_repair"
            if has_label "$LABELS" "agent:infra-blocked"; then
              REASON="provider_or_infra_failure"
            elif has_label "$LABELS" "agent:needs-decomposition"; then
              REASON="retry_exhausted"
            elif has_label "$LABELS" "verify:manual-needed"; then
              REASON="verify_retry_exhausted"
            elif has_label "$LABELS" "agent:needs-recovery"; then
              REASON="readiness_gap"
            fi

            MILESTONE=$(gh issue view "$SRC" -R "$REPO" --json milestone --jq '.milestone.title // "none"' 2>/dev/null || echo "none")
            TITLE_FLAT=$(printf '%s' "$TITLE" | tr '\n' ' ' | tr '\r' ' ')
            TITLE_CLEAN=${TITLE_FLAT//\"/\'}

            cat > .management-heal-body.md <<EOF
          ## Automated Management Queue Item
          <!-- management_ticket:v1 source_issue=$SRC queue=work reason=$REASON -->

          Source issue: #$SRC
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Escalation reason: $REASON
          Milestone: $MILESTONE

          ### Required management actions
          1. Diagnose why automation did not converge and choose one path: requirements patch, scope split, or infra repair.
          2. Update source issue #$SRC with concrete acceptance criteria and explicit file-level plan.
          3. Remove \`agent:manual-review-needed\` and re-add \`agent:actionable\` only when the issue is truly runnable.
          4. Close this management ticket once #$SRC is unblocked and re-queued.
          EOF

            CREATE_ARGS=()
            if [ "$MILESTONE" != "none" ] && [ -n "$MILESTONE" ]; then
              CREATE_ARGS+=(--milestone "$MILESTONE")
            fi
            PARK_TICKET=false
            if [ "$GLOBAL_AUTH_GATE_OPEN" = "true" ] && [ "$HAS_CODEX" != "true" ]; then
              PARK_TICKET=true
            fi
            if has_label "$LABELS" "agent:infra-blocked" || [ "$REASON" = "provider_or_infra_failure" ]; then
              CREATE_ARGS+=(--label "agent:infra-blocked")
              CREATE_ARGS+=(--label "agent:manual-review-needed")
              if [ "$HAS_CODEX" != "true" ]; then
                PARK_TICKET=true
              fi
            fi
            if has_label "$LABELS" "agent:provider-auth-failure"; then
              CREATE_ARGS+=(--label "agent:provider-auth-failure")
              CREATE_ARGS+=(--label "agent:manual-review-needed")
              if [ "$HAS_CODEX" != "true" ]; then
                PARK_TICKET=true
              fi
            fi
            if [ "$PARK_TICKET" != "true" ]; then
              CREATE_ARGS+=(--label "agent:actionable")
            fi
            MURL=$(gh issue create -R "$REPO" \
              --title "meta: manage issue #$SRC — $TITLE_CLEAN" \
              --body-file .management-heal-body.md \
              --label "agent:management-ticket" \
              --label "agent:management-needed" \
              --label "triage/ready" \
              "${CREATE_ARGS[@]}")
            rm -f .management-heal-body.md

            MNUM=$(echo "$MURL" | grep -oE '[0-9]+$')
            {
              echo "**Workflow management routing**"
              echo ""
              echo "- Escalation reason: \`$REASON\`"
              echo "- Management item: #$MNUM"
              echo ""
              echo "This was generated automatically by management self-heal."
            } > .management-heal-link-comment.md
            gh issue comment "$SRC" -R "$REPO" --body-file .management-heal-link-comment.md
            rm -f .management-heal-link-comment.md
            CREATED=$((CREATED + 1))
          done

          echo "Management ticket heal summary: processed=$PROCESSED relabeled=$RELABELED created=$CREATED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Normalize milestone coverage
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          MAX_FIXES=40
          DEFAULT_MS="v1.0: Working Product"
          PROCESSED=0
          UPDATED=0

          infer_from_labels() {
            local labels="$1"
            if echo "$labels" | grep -Eq '(^|,)m0(,|$)'; then echo "M0: Dogfood-Ready"; return; fi
            if echo "$labels" | grep -Eq '(^|,)m1(,|$)'; then echo "M1: Construction MVP"; return; fi
            if echo "$labels" | grep -Eq '(^|,)m2(,|$)'; then echo "M2: Agent Integration"; return; fi
            if echo "$labels" | grep -Eq '(^|,)m3(,|$)'; then echo "M3: Scale & Epistemics"; return; fi
            if echo "$labels" | grep -Eq '(^|,)m4(,|$)'; then echo "M4: World-Class"; return; fi
            echo ""
          }

          CANDIDATES=$(gh issue list -R "$REPO" --state open --limit 250 \
            --json number,title,body,labels,milestone \
            --jq '.[] | select(.milestone == null) | @base64')

          if [ -z "$CANDIDATES" ]; then
            echo "Milestone normalization: no open issues missing milestones."
            exit 0
          fi

          for ROW in $CANDIDATES; do
            [ "$PROCESSED" -ge "$MAX_FIXES" ] && break
            PROCESSED=$((PROCESSED + 1))

            ITEM=$(echo "$ROW" | base64 --decode)
            NUM=$(echo "$ITEM" | jq -r '.number')
            TITLE=$(echo "$ITEM" | jq -r '.title // ""')
            BODY=$(echo "$ITEM" | jq -r '.body // ""')
            LABELS=$(echo "$ITEM" | jq -r '[.labels[].name] | join(",")')

            TARGET_MS=""

            if echo "$LABELS" | grep -Eq '(^|,)agent:management-ticket(,|$)'; then
              SRC=$(echo "$BODY" | grep -ioE 'source issue:\s*#[0-9]+' | grep -oE '[0-9]+' | head -n1)
              if [ -z "$SRC" ]; then
                SRC=$(echo "$BODY" | grep -oE 'source_issue=[0-9]+' | grep -oE '[0-9]+' | head -n1)
              fi
              if [ -n "$SRC" ]; then
                TARGET_MS=$(gh issue view "$SRC" -R "$REPO" --json milestone --jq '.milestone.title // empty' 2>/dev/null || true)
                if [ -z "$TARGET_MS" ]; then
                  SRC_LABELS=$(gh issue view "$SRC" -R "$REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || true)
                  TARGET_MS=$(infer_from_labels "$SRC_LABELS")
                fi
              fi
            fi

            if [ -z "$TARGET_MS" ]; then
              TARGET_MS=$(infer_from_labels "$LABELS")
            fi

            if [ -z "$TARGET_MS" ]; then
              if echo "$TITLE" | grep -q '\[M0\]'; then TARGET_MS="M0: Dogfood-Ready"; fi
              if echo "$TITLE" | grep -q '\[M1\]'; then TARGET_MS="M1: Construction MVP"; fi
              if echo "$TITLE" | grep -q '\[M2\]'; then TARGET_MS="M2: Agent Integration"; fi
              if echo "$TITLE" | grep -q '\[M3\]'; then TARGET_MS="M3: Scale & Epistemics"; fi
              if echo "$TITLE" | grep -q '\[M4\]'; then TARGET_MS="M4: World-Class"; fi
            fi

            if [ -z "$TARGET_MS" ]; then
              TARGET_MS="$DEFAULT_MS"
            fi

            if gh issue edit "$NUM" -R "$REPO" --milestone "$TARGET_MS" >/dev/null 2>&1; then
              UPDATED=$((UPDATED + 1))
            fi
          done

          echo "Milestone normalization summary: processed=$PROCESSED updated=$UPDATED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deduplicate management tickets by source/queue
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          PROCESSED=0
          CLOSED=0
          declare -A CANONICAL
          declare -A CANONICAL_CLAIMED

          ROWS=$(gh issue list -R "$REPO" --state open \
            --label "agent:management-ticket" \
            --limit 200 \
            --json number,title,body,labels \
            --jq '
              [
                .[] |
                {
                  number,
                  title: (.title // ""),
                  body: (.body // ""),
                  claimed: (.labels | map(.name) | contains(["agent:claimed"])),
                  source: (
                    (try ((.body // "") | capture("source_issue=(?<n>[0-9]+)").n) catch null) //
                    (try ((.body // "") | capture("Source issue:\\s*#(?<n>[0-9]+)").n) catch null) //
                    (try ((.title // "") | capture("issue\\s*#(?<n>[0-9]+)").n) catch null) //
                    ""
                  ),
                  queue: (
                    (try ((.body // "") | capture("queue=(?<q>[a-z]+)").q) catch null) //
                    (if ((.title // "") | test("^meta:\\s*verify"; "i")) then "verify" else "work" end)
                  )
                } |
                select(.source != "")
              ]
              | sort_by((if .claimed then 0 else 1 end), .number)
              | .[]
              | @base64
            ')

          if [ -z "$ROWS" ]; then
            echo "Management dedupe: no tickets with parseable source metadata."
            exit 0
          fi

          for ROW in $ROWS; do
            ITEM=$(echo "$ROW" | base64 --decode)
            NUM=$(echo "$ITEM" | jq -r '.number')
            SRC=$(echo "$ITEM" | jq -r '.source')
            QUEUE=$(echo "$ITEM" | jq -r '.queue')
            CLAIMED=$(echo "$ITEM" | jq -r '.claimed')
            KEY="${QUEUE}:${SRC}"
            PROCESSED=$((PROCESSED + 1))

            if [ -z "${CANONICAL[$KEY]+x}" ]; then
              CANONICAL[$KEY]="$NUM"
              CANONICAL_CLAIMED[$KEY]="$CLAIMED"
              continue
            fi

            CANON="${CANONICAL[$KEY]}"
            CANON_IS_CLAIMED="${CANONICAL_CLAIMED[$KEY]}"

            if [ "$CLAIMED" = "true" ] && [ "$CANON_IS_CLAIMED" != "true" ]; then
              gh issue close "$CANON" -R "$REPO" \
                --comment "Auto-closing duplicate management ticket for source issue #$SRC (queue=$QUEUE). Canonical ticket is now #$NUM." || true
              CLOSED=$((CLOSED + 1))
              CANONICAL[$KEY]="$NUM"
              CANONICAL_CLAIMED[$KEY]="$CLAIMED"
              continue
            fi

            if [ "$CLAIMED" = "true" ] && [ "$CANON_IS_CLAIMED" = "true" ]; then
              # Two claimed duplicates indicate concurrent work; keep both open to avoid interrupting in-flight runs.
              continue
            fi

            gh issue close "$NUM" -R "$REPO" \
              --comment "Auto-closing duplicate management ticket for source issue #$SRC (queue=$QUEUE). Canonical ticket: #$CANON." || true
            CLOSED=$((CLOSED + 1))
          done

          echo "Management dedupe summary: processed=$PROCESSED closed=$CLOSED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Embedded management queue pass
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          PROCESSED=0
          RESOLVED=0
          REQUEUED=0
          MAX_MANAGEMENT_PER_RUN="${MAX_MANAGEMENT_PASS_PER_RUN:-15}"
          if [ "${{ steps.throughput.outputs.source_starved || 'false' }}" = "true" ]; then
            MAX_MANAGEMENT_PER_RUN=6
          fi
          HAS_CODEX=false
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            HAS_CODEX=true
          fi

          MGMT_NUMS=$(gh issue list -R "$REPO" --state open \
            --label "agent:management-ticket" \
            --limit 120 \
            --json number,labels \
            --jq '[.[] | select((.labels | map(.name) | contains(["agent:claimed"]) | not)) | .number] | sort | .[]')

          if [ -z "$MGMT_NUMS" ]; then
            echo "No management queue issues to process."
            exit 0
          fi

          has_label() {
            local labels="$1"
            local label="$2"
            echo "$labels" | grep -Fxq "$label"
          }

          find_open_pr_for_issue() {
            local src="$1"
            local pr
            pr=$(gh pr list -R "$REPO" --state open --search "closes #$src" --json number --jq 'first | .number // empty')
            if [ -z "$pr" ]; then
              pr=$(gh pr list -R "$REPO" --state open --head "claude/issue-$src" --json number --jq 'first | .number // empty')
            fi
            if [ -z "$pr" ]; then
              pr=$(gh pr list -R "$REPO" --state open --head "codex/issue-$src" --json number --jq 'first | .number // empty')
            fi
            echo "$pr"
          }

          for MNUM in $MGMT_NUMS; do
            if [ "$PROCESSED" -ge "$MAX_MANAGEMENT_PER_RUN" ]; then
              break
            fi
            PROCESSED=$((PROCESSED + 1))
            echo "Processing management issue #$MNUM"

            MJSON=$(gh issue view "$MNUM" -R "$REPO" --json title,body,state,labels 2>/dev/null || true)
            if [ -z "$MJSON" ] || [ "$MJSON" = "null" ]; then
              continue
            fi
            MBODY=$(echo "$MJSON" | jq -r '.body // ""')
            MLABELS=$(echo "$MJSON" | jq -r '.labels[].name')
            M_HAS_AUTH_HINT=false
            if has_label "$MLABELS" "agent:provider-auth-failure"; then
              M_HAS_AUTH_HINT=true
            else
              AUTH_COMMENT_COUNT=$(gh issue view "$MNUM" -R "$REPO" --json comments \
                --jq '[.comments[].body | select(contains("provider_auth_or_runtime_failure") or test("OAuth token has expired|authentication_error"))] | length' 2>/dev/null || echo 0)
              if [ "$AUTH_COMMENT_COUNT" -gt 0 ]; then
                if [ "$HAS_CODEX" = "true" ]; then
                  gh issue edit "$MNUM" -R "$REPO" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed" \
                    --add-label "triage/ready" \
                    --add-label "agent:actionable" || true
                else
                  gh issue edit "$MNUM" -R "$REPO" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed" \
                    --add-label "triage/ready" \
                    --remove-label "agent:actionable" || true
                fi
                M_HAS_AUTH_HINT=true
              fi
            fi

            SRC=$(echo "$MBODY" | grep -ioE 'source issue:\s*#[0-9]+' | grep -oE '[0-9]+' | head -n1)
            if [ -z "$SRC" ]; then
              SRC=$(echo "$MBODY" | grep -oE 'source_issue=[0-9]+' | grep -oE '[0-9]+' | head -n1)
            fi

            if [ -z "$SRC" ]; then
              gh issue edit "$MNUM" -R "$REPO" --add-label "agent:management-malformed" || true
              if ! has_label "$MLABELS" "agent:management-malformed"; then
                gh issue comment "$MNUM" -R "$REPO" \
                  --body "Management ticket is missing \`Source issue: #N\` metadata. Automation skipped auto-close for safety."
              fi
              continue
            fi

            if [ "$SRC" = "$MNUM" ]; then
              gh issue edit "$MNUM" -R "$REPO" --add-label "agent:management-malformed" || true
              if ! has_label "$MLABELS" "agent:management-malformed"; then
                gh issue comment "$MNUM" -R "$REPO" \
                  --body "Management ticket metadata resolved to itself (#$MNUM). Automation skipped auto-close for safety."
              fi
              continue
            fi

            SJSON=$(gh issue view "$SRC" -R "$REPO" --json state,labels,body,title,updatedAt 2>/dev/null || true)
            if [ -z "$SJSON" ] || [ "$SJSON" = "null" ]; then
              gh issue close "$MNUM" -R "$REPO" \
                --comment "Auto-closing management ticket: source issue #$SRC was not found."
              RESOLVED=$((RESOLVED + 1))
              continue
            fi

            SSTATE=$(echo "$SJSON" | jq -r '.state // "OPEN"')
            if [ "$SSTATE" = "CLOSED" ]; then
              gh issue close "$MNUM" -R "$REPO" \
                --comment "Auto-closing management ticket: source issue #$SRC is closed."
              RESOLVED=$((RESOLVED + 1))
              continue
            fi

            SLABELS=$(echo "$SJSON" | jq -r '.labels[].name')
            SBODY=$(echo "$SJSON" | jq -r '.body // ""')

            if has_label "$SLABELS" "agent:management-ticket"; then
              gh issue close "$MNUM" -R "$REPO" \
                --comment "Auto-closing management ticket: source issue #$SRC is already a management ticket and is handled in-place."
              RESOLVED=$((RESOLVED + 1))
              continue
            fi

            if has_label "$SLABELS" "agent:actionable" &&
               has_label "$SLABELS" "triage/ready" &&
               ! has_label "$SLABELS" "agent:management-needed" &&
               ! has_label "$SLABELS" "agent:manual-review-needed" &&
               ! has_label "$SLABELS" "agent:needs-decomposition" &&
               ! has_label "$SLABELS" "agent:needs-recovery" &&
               ! has_label "$SLABELS" "agent:infra-blocked" &&
               ! has_label "$SLABELS" "verify:pending"; then
              gh issue close "$MNUM" -R "$REPO" \
                --comment "Auto-closing management ticket: source issue #$SRC is already runnable in the worker queue."
              RESOLVED=$((RESOLVED + 1))
              continue
            fi

            HAS_ACCEPTANCE=false
            HAS_BRIEF=false
            HAS_FILE_HINTS=false
            if echo "$SBODY" | grep -Eiq 'acceptance criteria|- \[[ x]\]|must |should |expected|definition of done'; then
              HAS_ACCEPTANCE=true
            fi
            if echo "$SBODY" | grep -Eiq 'agent implementation brief|implementation brief'; then
              HAS_BRIEF=true
            fi
            if echo "$SBODY" | grep -Eiq 'src/|scripts/|docs/|\.github/'; then
              HAS_FILE_HINTS=true
            fi
            READINESS_SCORE=0
            [ "$HAS_ACCEPTANCE" = "true" ] && READINESS_SCORE=$((READINESS_SCORE + 1))
            [ "$HAS_BRIEF" = "true" ] && READINESS_SCORE=$((READINESS_SCORE + 1))
            [ "$HAS_FILE_HINTS" = "true" ] && READINESS_SCORE=$((READINESS_SCORE + 1))

            UNKNOWN_VERIFY=$(gh issue view "$SRC" -R "$REPO" --json comments \
              --jq '[.comments[].body | select(contains("\"role\":\"verifier\"") and contains("\"verdict\":\"UNKNOWN\""))] | length')
            OPEN_PR=$(find_open_pr_for_issue "$SRC")
            HAS_NEEDS_DECOMP=false
            HAS_INFRA_BLOCKED=false
            HAS_AGENT_BLOCKED=false
            HAS_MANUAL_REVIEW=false
            HAS_MGMT_NEEDED=false
            HAS_PROVIDER_AUTH_FAIL=false
            ALLOW_INFRA_RETRY=false
            if has_label "$SLABELS" "agent:needs-decomposition"; then HAS_NEEDS_DECOMP=true; fi
            if has_label "$SLABELS" "agent:infra-blocked"; then HAS_INFRA_BLOCKED=true; fi
            if has_label "$SLABELS" "agent:needs-recovery"; then HAS_AGENT_BLOCKED=true; fi
            if has_label "$SLABELS" "agent:manual-review-needed"; then HAS_MANUAL_REVIEW=true; fi
            if has_label "$SLABELS" "agent:management-needed"; then HAS_MGMT_NEEDED=true; fi
            if has_label "$SLABELS" "agent:provider-auth-failure"; then HAS_PROVIDER_AUTH_FAIL=true; fi

            # Keep management ticket provider-auth labels synchronized with source issue state.
            if [ "$HAS_PROVIDER_AUTH_FAIL" = "true" ]; then
              if [ "$HAS_CODEX" = "true" ]; then
                if ! has_label "$MLABELS" "agent:provider-auth-failure" || ! has_label "$MLABELS" "agent:infra-blocked" || ! has_label "$MLABELS" "agent:actionable"; then
                  gh issue edit "$MNUM" -R "$REPO" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed" \
                    --add-label "triage/ready" \
                    --add-label "agent:actionable" || true
                fi
              else
                if ! has_label "$MLABELS" "agent:provider-auth-failure" || ! has_label "$MLABELS" "agent:infra-blocked" || has_label "$MLABELS" "agent:actionable"; then
                  gh issue edit "$MNUM" -R "$REPO" \
                    --add-label "agent:provider-auth-failure" \
                    --add-label "agent:infra-blocked" \
                    --add-label "agent:management-needed" \
                    --add-label "agent:manual-review-needed" \
                    --add-label "triage/ready" \
                    --remove-label "agent:actionable" || true
                fi
              fi
            fi
            if [ "$HAS_INFRA_BLOCKED" = "true" ]; then
              SUPDATED=$(echo "$SJSON" | jq -r '.updatedAt // ""')
              if [ -n "$SUPDATED" ] && [ "$SUPDATED" != "null" ]; then
                NOW_EPOCH=$(date -u +%s)
                UPDATED_EPOCH=$(date -u -d "$SUPDATED" +%s 2>/dev/null || echo 0)
                if [ "$UPDATED_EPOCH" -gt 0 ]; then
                  AGE_MIN=$(( (NOW_EPOCH - UPDATED_EPOCH) / 60 ))
                  if [ "$AGE_MIN" -ge "$PROVIDER_RETRY_COOLDOWN_MIN" ]; then
                    ALLOW_INFRA_RETRY=true
                  fi
                fi
              fi
            fi

            REQUEUED_THIS=false

            if [ -n "$OPEN_PR" ] && { has_label "$SLABELS" "verify:manual-needed" || [ "$HAS_MGMT_NEEDED" = "true" ]; } && ! has_label "$SLABELS" "verify:pending"; then
              gh issue edit "$SRC" -R "$REPO" \
                --remove-label "verify:manual-needed" \
                --remove-label "agent:manual-review-needed" \
                --remove-label "agent:management-needed" \
                --remove-label "agent:needs-recovery" \
                --add-label "verify:pending" || true
              {
                echo "**Embedded management pass** re-queued autonomous verification."
                echo ""
                echo "- Open PR detected: #$OPEN_PR"
                echo "- Unknown verifier outcomes so far: $UNKNOWN_VERIFY"
                echo "- Action: moved back to \`verify:pending\`"
              } > .management-source-comment.md
              gh issue comment "$SRC" -R "$REPO" --body-file .management-source-comment.md
              rm -f .management-source-comment.md
              REQUEUED_THIS=true
            elif [ "$READINESS_SCORE" -ge 2 ]; then
              if [ "$HAS_AGENT_BLOCKED" = "true" ] || { [ "$HAS_MANUAL_REVIEW" = "true" ] && [ "$HAS_MGMT_NEEDED" = "true" ] && [ "$HAS_NEEDS_DECOMP" != "true" ] && { [ "$HAS_INFRA_BLOCKED" != "true" ] || [ "$ALLOW_INFRA_RETRY" = "true" ]; }; }; then
                gh issue edit "$SRC" -R "$REPO" \
                  --remove-label "agent:manual-review-needed" \
                  --remove-label "agent:management-needed" \
                  --remove-label "agent:needs-decomposition" \
                  --remove-label "agent:needs-recovery" \
                  --remove-label "agent:infra-blocked" \
                  --remove-label "triage/missing-essentials" \
                  --add-label "agent:actionable" \
                  --add-label "triage/ready" || true
                {
                  echo "**Embedded management pass** re-queued this issue for the worker loop."
                  echo ""
                  echo "- Readiness score: $READINESS_SCORE/3"
                  if [ "$HAS_INFRA_BLOCKED" = "true" ]; then
                    echo "- Infra retry cooldown reached: ${PROVIDER_RETRY_COOLDOWN_MIN}m"
                  fi
                  echo "- Action: restored \`agent:actionable\` and cleared manual-management blockers."
                } > .management-source-comment.md
                gh issue comment "$SRC" -R "$REPO" --body-file .management-source-comment.md
                rm -f .management-source-comment.md
                REQUEUED_THIS=true
              fi
            fi

            if [ "$REQUEUED_THIS" = "true" ]; then
              gh issue close "$MNUM" -R "$REPO" \
                --comment "Auto-closing management ticket: source issue #$SRC was re-queued by embedded management logic."
              RESOLVED=$((RESOLVED + 1))
              REQUEUED=$((REQUEUED + 1))
            fi
          done

          echo "Management pass summary: processed=$PROCESSED resolved=$RESOLVED requeued=$REQUEUED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      # ── Pre-flight: unblock resolved dependencies ───────────────────
      # Before selecting work, check if any agent:needs-recovery issues have had
      # all their dependencies resolved (e.g., by async merges since last run).
      - name: Auto-unblock resolved dependencies
        if: steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          echo "=== Pre-flight: checking for issues to unblock ==="

          BLOCKED_NUMS=$(gh issue list -R "$REPO" --state open \
            --label "agent:needs-recovery" \
            --limit 50 \
            --json number --jq '.[].number')

          if [ -z "$BLOCKED_NUMS" ]; then
            echo "No blocked issues."
            exit 0
          fi

          is_soft_dependency() {
            local dep="$1"
            local dep_json
            dep_json=$(gh issue view "$dep" -R "$REPO" --json labels,title,state 2>/dev/null || true)
            if [ -z "$dep_json" ] || [ "$dep_json" = "null" ]; then
              echo "false"
              return
            fi

            echo "$dep_json" | jq -r '
              ([.labels[].name] | any(
                . == "kind/tracking" or
                . == "patrol" or
                . == "agent:management-ticket" or
                . == "agent:needs-decomposition" or
                . == "post-ship" or
                . == "lifecycle/frozen"
              )) as $has_soft_label
              | (.title // "" | test("^meta:\\s*(manage|verify)\\s*issue\\s*#"; "i")) as $meta_title
              | ($has_soft_label or $meta_title)
            '
          }

          echo "Blocked issues: $(echo $BLOCKED_NUMS | tr '\n' ' ')"
          UNBLOCKED=0

          for BNUM in $BLOCKED_NUMS; do
            ISSUE_LABELS=$(gh issue view "$BNUM" -R "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)
            if echo "$ISSUE_LABELS" | grep -Fxq "triage/missing-essentials"; then
              echo "Keeping #$BNUM blocked (triage/missing-essentials)."
              continue
            fi

            # Get body and comments to find "Blocked by:" declarations
            ISSUE_BODY=$(gh issue view "$BNUM" -R "$REPO" --json body --jq '.body' 2>/dev/null || echo "")
            ISSUE_COMMENTS=$(gh issue view "$BNUM" -R "$REPO" --json comments --jq '.comments[].body' 2>/dev/null || echo "")

            # Extract deps from "Blocked by:" lines, stripping parenthetical context
            ALL_TEXT=$(printf '%s\n%s' "$ISSUE_BODY" "$ISSUE_COMMENTS")
            DEPS=$(echo "$ALL_TEXT" | grep -iE 'blocked by:' | sed 's/(.*//' | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | sort -un)

            if [ -z "$DEPS" ]; then
              echo "Unblocking #$BNUM — stale blocked label (no hard 'Blocked by:' dependencies)."
              gh issue edit "$BNUM" -R "$REPO" \
                --remove-label "agent:needs-recovery" \
                --add-label "agent:actionable" || true
              continue
            fi

            ALL_RESOLVED=true
            for DEP in $DEPS; do
              DEP_STATE=$(gh issue view "$DEP" -R "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              if [ "$DEP_STATE" = "CLOSED" ]; then
                continue
              fi

              SOFT_DEP=$(is_soft_dependency "$DEP")
              if [ "$SOFT_DEP" = "true" ]; then
                echo "Treating open dependency #$DEP as soft (tracking/meta); not blocking #$BNUM."
                continue
              fi

              if [ "$DEP_STATE" != "CLOSED" ]; then
                ALL_RESOLVED=false
                break
              fi
            done

            if [ "$ALL_RESOLVED" = "true" ]; then
              echo "Unblocking #$BNUM — all dependencies resolved"
              gh issue edit "$BNUM" -R "$REPO" \
                --remove-label "agent:needs-recovery" \
                --add-label "agent:actionable"
              {
                echo "**Auto-unblocked** — all blocking dependencies are now resolved."
                echo ""
                echo "Dependencies checked: $(echo $DEPS | tr '\n' ', ' | sed 's/,$//')"
                echo ""
                echo "This issue is now available for the worker agent."
              } > .unblock-comment.md
              gh issue comment "$BNUM" -R "$REPO" --body-file .unblock-comment.md
              rm -f .unblock-comment.md
              UNBLOCKED=$((UNBLOCKED + 1))
            fi
          done

          echo "Unblocked $UNBLOCKED issues."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Find Issue ───────────────────────────────────────────────────
      - name: Find next ready issue
        if: steps.breaker.outputs.open != 'true' && steps.infra-gate.outputs.open != 'true' && steps.provider-auth-gate.outputs.open != 'true'
        id: find
        run: |
          HAS_CODEX=false
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            HAS_CODEX=true
          fi

          if [ -n "${{ inputs.issue_number }}" ]; then
            # Manual override — work on specific issue
            NUM="${{ inputs.issue_number }}"
            TITLE=$(gh issue view "$NUM" -R "$REPO" --json title --jq '.title')
            MILESTONE=$(gh issue view "$NUM" -R "$REPO" --json milestone --jq '.milestone.title // "none"')
            IS_MANAGEMENT=$(gh issue view "$NUM" -R "$REPO" --json labels --jq '[.labels[].name] | contains(["agent:management-ticket"])')
            echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
            echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "issue_milestone=$MILESTONE" >> "$GITHUB_OUTPUT"
            echo "issue_is_management=$IS_MANAGEMENT" >> "$GITHUB_OUTPUT"
            echo "Selected (manual): #$NUM — $TITLE"
            exit 0
          fi

          # Auto-select: find issues that are ready + actionable + not claimed
          # Priority lock: never advance beyond the earliest milestone that still has open issues.
          ACTIVE_MILESTONE=$(gh issue list -R "$REPO" --state open --limit 500 \
            --json milestone,labels | jq -r '
              [.[] |
                select((.labels | map(.name) | contains(["agent:management-ticket"]) | not)) |
                (.milestone.title // empty) |
                select(. != "") |
                {title: ., order: (
                  if . == "M0: Dogfood-Ready" then 0
                  elif . == "M1: Construction MVP" then 1
                  elif . == "M2: Agent Integration" then 2
                  elif . == "M3: Scale & Epistemics" then 3
                  elif . == "M4: World-Class" then 4
                  else 99 end
                )}
              ] | sort_by(.order, .title) | first | .title // "none"
            ')
          echo "active_milestone=$ACTIVE_MILESTONE" >> "$GITHUB_OUTPUT"

          if [ "$ACTIVE_MILESTONE" = "none" ]; then
            echo "No active milestone found among open source issues."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SOURCE_STARVED="${{ steps.throughput.outputs.source_starved || 'false' }}"
          RUNNABLE_SOURCE="${{ steps.throughput.outputs.runnable_source || '0' }}"
          CLOSED_SOURCE_24H="${{ steps.throughput.outputs.closed_source_24h || '0' }}"
          echo "Objective function: source_throughput_primary=$SOURCE_STARVED runnable_source=$RUNNABLE_SOURCE closed_source_24h=$CLOSED_SOURCE_24H"

          ISSUES=$(gh issue list -R "$REPO" --state open \
            --label "triage/ready" --label "agent:actionable" \
            --limit 200 \
            --json number,title,labels,milestone | jq --arg has_codex "$HAS_CODEX" --arg active_milestone "$ACTIVE_MILESTONE" --arg source_starved "$SOURCE_STARVED" '
              [.[] |
                select((.milestone.title // "none") == $active_milestone) |
                select(.labels | map(.name) |
                  (contains(["agent:claimed"]) | not) and
                  (contains(["lifecycle/frozen"]) | not) and
                  (contains(["triage/missing-essentials"]) | not) and
                  (contains(["agent:needs-recovery"]) | not) and
                  (contains(["verify:pending"]) | not) and
                  (
                    (contains(["agent:infra-blocked"]) | not) or
                    (
                      contains(["agent:management-ticket"]) and
                      (contains(["agent:provider-auth-failure"]) | not)
                    )
                  )
                ) |
                {
                  number,
                  title,
                  milestone: (.milestone.title // "none"),
                  is_management: (.labels | map(.name) | contains(["agent:management-ticket"])),
                  objective_bucket: (
                    if (.labels | map(.name) | contains(["agent:management-ticket"])) then
                      (if $source_starved == "true" then 3 else 2 end)
                    elif (.labels | map(.name) | contains(["agent:management-needed"])) then
                      1
                    else
                      0
                    end
                  )
                }
              ] | sort_by(.objective_bucket, .number) | first
            ')

          if [ -z "$ISSUES" ] || [ "$ISSUES" = "null" ]; then
            echo "No runnable issue in active milestone $ACTIVE_MILESTONE. Holding worker selection."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NUM=$(echo "$ISSUES" | jq -r '.number')
          TITLE=$(echo "$ISSUES" | jq -r '.title')
          MILESTONE=$(echo "$ISSUES" | jq -r '.milestone // "none"')
          IS_MANAGEMENT=$(echo "$ISSUES" | jq -r '.is_management // false')
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "issue_milestone=$MILESTONE" >> "$GITHUB_OUTPUT"
          echo "issue_is_management=$IS_MANAGEMENT" >> "$GITHUB_OUTPUT"
          echo "Selected (auto): #$NUM — $TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      # ── Retry limit — skip issues that keep failing ─────────────────
      # If the agent has failed on this issue many times (no convergent progress),
      # shelve it to stop comment spam and flag for human review or decomposition.
      - name: Check retry limit
        if: steps.find.outputs.issue_number && steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        id: retries
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          IS_MANAGEMENT=${{ steps.find.outputs.issue_is_management || 'false' }}
          MAX_ATTEMPTS=${MAX_ISSUE_ATTEMPTS}

          if [ "$IS_MANAGEMENT" = "true" ]; then
            echo "Issue #$NUM is a management ticket; bypassing retry-limit shelve logic."
            echo "attempt_count=0" >> "$GITHUB_OUTPUT"
            echo "shelved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Count failure attempts from structured worker evidence since the last submitted run.
          # This prevents stale historical decomposition markers from permanently shelving an issue.
          FAIL_COUNT=$(gh issue view "$NUM" -R "$REPO" --json comments --jq '
            [ .comments[].body
              | (try capture("agent_evidence\\s*=\\s*(?<json>\\{.*\\})").json catch empty)
              | (try fromjson catch empty)
              | select(.role == "worker")
            ] as $events
            | ([$events | to_entries[] | select(.value.status == "submitted") | .key] | last // -1) as $last_success
            | [$events | to_entries[] | select(.key > $last_success) | .value
               | select(.status == "failed" or .status == "no_changes")] | length
          ')

          echo "Issue #$NUM has $FAIL_COUNT failed/no-change attempts since last submitted run (max $MAX_ATTEMPTS)"
          echo "attempt_count=$FAIL_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$FAIL_COUNT" -ge "$MAX_ATTEMPTS" ]; then
            echo "::warning::Issue #$NUM has failed $FAIL_COUNT times. Shelving for decomposition."
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:actionable" \
              --add-label "agent:needs-decomposition" \
              --add-label "triage/missing-essentials"
            {
              echo "**Agent Work Loop** — shelved after $FAIL_COUNT failed/no-change attempts since last submitted run."
              echo ""
              echo "### Adaptive diagnosis"
              echo "- Repeated attempts are not converging."
              echo "- This usually means missing acceptance detail, unstable dependencies, or issue scope too broad."
              echo ""
              echo "### Required rework before retry"
              echo "1. Add/refresh **Agent Implementation Brief** with concrete file paths and expected behavior."
              echo "2. Split this issue into 2-4 sub-issues if it spans multiple subsystems."
              echo "3. Re-add \`agent:actionable\` once scope is concrete."
            } > .shelve-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .shelve-comment.md
            rm -f .shelve-comment.md
            echo "shelved=true" >> "$GITHUB_OUTPUT"
          else
            echo "shelved=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Readiness quality gate
        if: steps.find.outputs.issue_number && steps.retries.outputs.shelved != 'true' && steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        id: readiness
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          IS_MANAGEMENT=${{ steps.find.outputs.issue_is_management || 'false' }}

          if [ "$IS_MANAGEMENT" = "true" ]; then
            echo "Issue #$NUM is a management ticket; bypassing implementation-readiness gate."
            echo "readiness_score=3" >> "$GITHUB_OUTPUT"
            echo "has_acceptance=true" >> "$GITHUB_OUTPUT"
            echo "has_brief=true" >> "$GITHUB_OUTPUT"
            echo "has_file_hints=true" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BODY=$(gh issue view "$NUM" -R "$REPO" --json body --jq '.body // ""')
          HAS_ACCEPTANCE=false
          HAS_BRIEF=false
          HAS_FILE_HINTS=false

          if echo "$BODY" | grep -Eiq 'acceptance criteria|- \[[ x]\]|must |should |expected|definition of done'; then
            HAS_ACCEPTANCE=true
          fi
          if echo "$BODY" | grep -Eiq 'agent implementation brief|implementation brief'; then
            HAS_BRIEF=true
          fi
          if echo "$BODY" | grep -Eiq 'src/|scripts/|docs/|\.github/'; then
            HAS_FILE_HINTS=true
          fi

          SCORE=0
          [ "$HAS_ACCEPTANCE" = "true" ] && SCORE=$((SCORE + 1))
          [ "$HAS_BRIEF" = "true" ] && SCORE=$((SCORE + 1))
          [ "$HAS_FILE_HINTS" = "true" ] && SCORE=$((SCORE + 1))

          echo "readiness_score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "has_acceptance=$HAS_ACCEPTANCE" >> "$GITHUB_OUTPUT"
          echo "has_brief=$HAS_BRIEF" >> "$GITHUB_OUTPUT"
          echo "has_file_hints=$HAS_FILE_HINTS" >> "$GITHUB_OUTPUT"

          if [ "$SCORE" -lt 2 ]; then
            echo "::warning::Issue #$NUM lacks enough implementation detail (score=$SCORE/3)."
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:actionable" \
              --add-label "triage/missing-essentials" \
              --add-label "agent:needs-recovery"
            {
              echo "**Agent Work Loop** — paused due to low implementation readiness (score: $SCORE/3)."
              echo ""
              echo "Observed:"
              echo "- Acceptance criteria present: $HAS_ACCEPTANCE"
              echo "- Agent Implementation Brief present: $HAS_BRIEF"
              echo "- Concrete file hints present: $HAS_FILE_HINTS"
              echo ""
              echo "Please add missing detail, then re-add \`agent:actionable\`."
            } > .readiness-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .readiness-comment.md
            rm -f .readiness-comment.md
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dependency blockers
        if: steps.find.outputs.issue_number && steps.retries.outputs.shelved != 'true' && steps.breaker.outputs.open != 'true' && inputs.dry_run != true && inputs.dry_run != 'true'
        id: deps
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          BODY=$(gh issue view "$NUM" -R "$REPO" --json body --jq '.body')
          LABELS=$(gh issue view "$NUM" -R "$REPO" --json labels --jq '.labels[].name' || true)

          is_soft_dependency() {
            local dep="$1"
            local dep_json
            dep_json=$(gh issue view "$dep" -R "$REPO" --json labels,title,state 2>/dev/null || true)
            if [ -z "$dep_json" ] || [ "$dep_json" = "null" ]; then
              echo "false"
              return
            fi

            echo "$dep_json" | jq -r '
              ([.labels[].name] | any(
                . == "kind/tracking" or
                . == "patrol" or
                . == "agent:management-ticket" or
                . == "agent:needs-decomposition" or
                . == "post-ship" or
                . == "lifecycle/frozen"
              )) as $has_soft_label
              | (.title // "" | test("^meta:\\s*(manage|verify)\\s*issue\\s*#"; "i")) as $meta_title
              | ($has_soft_label or $meta_title)
            '
          }

          # Hard blockers are explicit "Blocked by: #X" references.
          DEPS=$(echo "$BODY" | grep -ioP 'blocked by:\s*#\K\d+' || true)

          if [ -z "$DEPS" ]; then
            if echo "$LABELS" | grep -Fxq "agent:needs-recovery" && ! echo "$LABELS" | grep -Fxq "triage/missing-essentials"; then
              echo "Clearing stale blocked label on #$NUM (no hard blockers)."
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:needs-recovery" \
                --add-label "agent:actionable" || true
            fi
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for DEP in $DEPS; do
            STATE=$(gh issue view "$DEP" -R "$REPO" --json state --jq '.state')
            if [ "$STATE" = "OPEN" ]; then
              SOFT_DEP=$(is_soft_dependency "$DEP")
              if [ "$SOFT_DEP" = "true" ]; then
                echo "Skipping soft dependency #$DEP for #$NUM"
                continue
              fi
              echo "::warning::Issue #$NUM is blocked by open dependency #$DEP"
              # Label it blocked and find next issue
              gh issue edit "$NUM" -R "$REPO" --add-label "agent:needs-recovery"
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if echo "$LABELS" | grep -Fxq "agent:needs-recovery" && ! echo "$LABELS" | grep -Fxq "triage/missing-essentials"; then
            echo "All hard blockers resolved for #$NUM; removing agent:needs-recovery."
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:needs-recovery" \
              --add-label "agent:actionable" || true
          fi
          echo "blocked=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if no issue or blocked or dry run
        if: >-
          !steps.find.outputs.issue_number ||
          steps.deps.outputs.blocked == 'true' ||
          steps.retries.outputs.shelved == 'true' ||
          steps.readiness.outputs.ready == 'false' ||
          (inputs.dry_run == true || inputs.dry_run == 'true') ||
          steps.breaker.outputs.open == 'true'
        run: |
          echo "Skipping agent dispatch."
          echo "  Issue: ${{ steps.find.outputs.issue_number || 'none' }}"
          echo "  Blocked: ${{ steps.deps.outputs.blocked }}"
          echo "  Shelved: ${{ steps.retries.outputs.shelved }}"
          echo "  Ready: ${{ steps.readiness.outputs.ready }}"
          echo "  Dry run: ${{ inputs.dry_run }}"
          echo "  Breaker: ${{ steps.breaker.outputs.open }}"

      # ── Claim & Setup ───────────────────────────────────────────────
      - name: Claim issue
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          gh issue edit "$NUM" -R "$REPO" --add-label "agent:claimed"
          {
            echo "**Agent Work Loop** claimed this issue."
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Triggered:** ${{ github.event_name }}"
            echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Working on implementation now..."
          } > .claim-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .claim-comment.md
          rm -f .claim-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build adaptive strategy
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: strategy
        run: |
          ATTEMPTS="${{ steps.retries.outputs.attempt_count || '0' }}"
          BASE_TURNS="${{ inputs.max_turns || env.DEFAULT_MAX_TURNS }}"
          MILESTONE="${{ steps.find.outputs.issue_milestone || 'none' }}"
          LONG_RUN_THRESHOLD="${LONG_RUN_THRESHOLD}"
          if ! [[ "$ATTEMPTS" =~ ^[0-9]+$ ]]; then ATTEMPTS=0; fi
          if ! [[ "$BASE_TURNS" =~ ^[0-9]+$ ]]; then BASE_TURNS=${DEFAULT_MAX_TURNS}; fi

          BONUS=0
          FOCUS="normal"
          COMPLEXITY="standard"
          TEST_PROFILE="foundation"
          MILESTONE_BONUS=0
          META_CHECK_INTERVAL=12

          case "$MILESTONE" in
            "M0: Dogfood-Ready")
              COMPLEXITY="high-foundation"
              TEST_PROFILE="foundation"
              MILESTONE_BONUS=14
              ;;
            "M1: Construction MVP")
              COMPLEXITY="medium-high"
              TEST_PROFILE="foundation"
              MILESTONE_BONUS=12
              ;;
            "M2: Agent Integration")
              COMPLEXITY="high-integration"
              TEST_PROFILE="integration"
              MILESTONE_BONUS=18
              ;;
            "M3: Scale & Epistemics")
              COMPLEXITY="very-high-scale"
              TEST_PROFILE="scale"
              MILESTONE_BONUS=22
              ;;
            "M4: World-Class")
              COMPLEXITY="extreme-world-class"
              TEST_PROFILE="scale"
              MILESTONE_BONUS=26
              ;;
            *)
              COMPLEXITY="standard"
              TEST_PROFILE="foundation"
              MILESTONE_BONUS=8
              ;;
          esac

          if [ "$ATTEMPTS" -ge 1 ]; then
            BONUS=12
            FOCUS="rework"
          fi
          if [ "$ATTEMPTS" -ge 2 ]; then
            BONUS=20
            FOCUS="decomposition-first"
          fi
          if [ "$ATTEMPTS" -ge 3 ]; then
            BONUS=30
            FOCUS="narrow-scope-only"
          fi
          if [ "$ATTEMPTS" -ge 4 ]; then
            BONUS=38
            FOCUS="stabilize-and-escalate"
          fi

          EFFECTIVE=$((BASE_TURNS + BONUS + MILESTONE_BONUS))
          if [ "$EFFECTIVE" -gt 120 ]; then EFFECTIVE=120; fi
          if [ "$EFFECTIVE" -ge "$LONG_RUN_THRESHOLD" ]; then
            META_CHECK_INTERVAL=15
            LONG_RUN=true
          else
            LONG_RUN=false
          fi

          echo "effective_max_turns=$EFFECTIVE" >> "$GITHUB_OUTPUT"
          echo "focus=$FOCUS" >> "$GITHUB_OUTPUT"
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          echo "complexity=$COMPLEXITY" >> "$GITHUB_OUTPUT"
          echo "test_profile=$TEST_PROFILE" >> "$GITHUB_OUTPUT"
          echo "long_run=$LONG_RUN" >> "$GITHUB_OUTPUT"
          echo "meta_check_interval=$META_CHECK_INTERVAL" >> "$GITHUB_OUTPUT"
          echo "Adaptive strategy: milestone=$MILESTONE complexity=$COMPLEXITY attempts=$ATTEMPTS base=$BASE_TURNS effective=$EFFECTIVE focus=$FOCUS test_profile=$TEST_PROFILE long_run=$LONG_RUN meta_check_interval=$META_CHECK_INTERVAL"

      - name: Resolve provider plan
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: provider
        run: |
          REQUESTED="${{ inputs.agent_provider || 'auto' }}"
          ENABLE_FALLBACK_INPUT="${{ inputs.enable_fallback }}"
          ALLOW_FALLBACK=true
          if [ "$ENABLE_FALLBACK_INPUT" = "false" ] || [ "$ENABLE_FALLBACK_INPUT" = "0" ]; then
            ALLOW_FALLBACK=false
          fi
          ATTEMPTS="${{ steps.strategy.outputs.attempts || '0' }}"
          NUM="${{ steps.find.outputs.issue_number }}"
          ISSUE_LABELS=$(gh issue view "$NUM" -R "$REPO" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          ISSUE_COMMENTS=$(gh issue view "$NUM" -R "$REPO" --json comments --jq '.comments[-20:] | .[].body // ""' 2>/dev/null || echo "")

          HAS_CLAUDE=false
          HAS_CODEX=false
          HAS_AUTH_HINT=false
          HAS_GLOBAL_CLAUDE_AUTH_INCIDENT=false
          [ -n "${CLAUDE_TOKEN:-}" ] && HAS_CLAUDE=true
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${CODEX_AUTH_JSON:-}" ]; then
            HAS_CODEX=true
          fi
          echo "$ISSUE_LABELS" | grep -Eq '(^|,)agent:provider-auth-failure(,|$)' && HAS_AUTH_HINT=true
          echo "$ISSUE_COMMENTS" | grep -Eiq 'provider_auth_or_runtime_failure|authentication_error|OAuth token has expired' && HAS_AUTH_HINT=true

          CUTOFF=$(date -u -d "${RECENT_INFRA_WINDOW_MIN} minutes ago" '+%Y-%m-%dT%H:%M:%SZ')
          RECENT_AUTH=$(gh issue list -R "$REPO" --state open \
            --label "agent:provider-auth-failure" \
            --search "updated:>=$CUTOFF -label:agent:management-ticket" \
            --limit 200 \
            --json number --jq 'length')
          if [ "$RECENT_AUTH" -ge 1 ]; then
            HAS_GLOBAL_CLAUDE_AUTH_INCIDENT=true
          fi

          if ! [[ "$ATTEMPTS" =~ ^[0-9]+$ ]]; then ATTEMPTS=0; fi
          if [ "$ATTEMPTS" -ge 3 ]; then
            # Do not keep running cross-provider fallback forever on repeated failures.
            ALLOW_FALLBACK=false
            echo "Disabling provider fallback for high-attempt issue (attempts=$ATTEMPTS)."
          fi

          if [ "$REQUESTED" = "claude" ] && [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::agent_provider=claude but CLAUDE_CODE_OAUTH_TOKEN is unavailable."
            exit 1
          fi
          if [ "$REQUESTED" = "codex" ] && [ "$HAS_CODEX" != "true" ]; then
            echo "::error::agent_provider=codex but Codex credentials are unavailable (need OPENAI_API_KEY or CODEX_AUTH_JSON)."
            exit 1
          fi

          if [ "$HAS_CLAUDE" != "true" ] && [ "$HAS_CODEX" != "true" ]; then
            echo "::error::No provider credentials available. Set CLAUDE_CODE_OAUTH_TOKEN and either CODEX_AUTH_JSON or OPENAI_API_KEY."
            exit 1
          fi

          if [ "$REQUESTED" = "auto" ] && [ "$HAS_GLOBAL_CLAUDE_AUTH_INCIDENT" = "true" ] && [ "$HAS_CODEX" = "true" ]; then
            PRIMARY="codex"
            FALLBACK=""
            echo "Provider plan override: recent global provider-auth incidents detected; preferring codex primary."
            echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
            echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "has_claude=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"
            echo "has_codex=$HAS_CODEX" >> "$GITHUB_OUTPUT"
            echo "has_auth_hint=$HAS_AUTH_HINT" >> "$GITHUB_OUTPUT"
            echo "has_global_claude_auth_incident=$HAS_GLOBAL_CLAUDE_AUTH_INCIDENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$REQUESTED" = "auto" ] && [ "$HAS_AUTH_HINT" = "true" ] && [ "$HAS_CODEX" = "true" ]; then
            PRIMARY="codex"
            FALLBACK=""
            echo "Provider plan override: auth-failure hint present, preferring codex primary."
            echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
            echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"
            echo "has_claude=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"
            echo "has_codex=$HAS_CODEX" >> "$GITHUB_OUTPUT"
            echo "has_auth_hint=$HAS_AUTH_HINT" >> "$GITHUB_OUTPUT"
            echo "has_global_claude_auth_incident=$HAS_GLOBAL_CLAUDE_AUTH_INCIDENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PRIMARY=""
          FALLBACK=""
          if [ "$REQUESTED" = "claude" ]; then
            PRIMARY="claude"
            [ "$ALLOW_FALLBACK" = "true" ] && [ "$HAS_CODEX" = "true" ] && FALLBACK="codex"
          elif [ "$REQUESTED" = "codex" ]; then
            PRIMARY="codex"
            [ "$ALLOW_FALLBACK" = "true" ] && [ "$HAS_CLAUDE" = "true" ] && FALLBACK="claude"
          else
            if [ "$HAS_CLAUDE" = "true" ]; then
              PRIMARY="claude"
              [ "$ALLOW_FALLBACK" = "true" ] && [ "$HAS_CODEX" = "true" ] && FALLBACK="codex"
            else
              PRIMARY="codex"
              [ "$ALLOW_FALLBACK" = "true" ] && [ "$HAS_CLAUDE" = "true" ] && FALLBACK="claude"
            fi
          fi

          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"
          echo "has_claude=$HAS_CLAUDE" >> "$GITHUB_OUTPUT"
          echo "has_codex=$HAS_CODEX" >> "$GITHUB_OUTPUT"
          echo "has_auth_hint=$HAS_AUTH_HINT" >> "$GITHUB_OUTPUT"
          echo "has_global_claude_auth_incident=$HAS_GLOBAL_CLAUDE_AUTH_INCIDENT" >> "$GITHUB_OUTPUT"
          echo "Provider plan: primary=$PRIMARY fallback=${FALLBACK:-none}"
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECENT_INFRA_WINDOW_MIN: ${{ env.RECENT_INFRA_WINDOW_MIN }}

      # Free disk space — LiBrainian + node_modules need ~4GB
      - name: Free disk space
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          echo "Disk space available: $(df -h / | tail -1 | awk '{print $4}')"

      - uses: actions/checkout@v4
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'

      - uses: actions/setup-node@v4
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        id: install-build
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "failure_kind=none" >> "$GITHUB_OUTPUT"

          TRANSIENT_PATTERN='ECONNRESET|socket hang up|ETIMEDOUT|EAI_AGAIN|ENOTFOUND|502 Bad Gateway|503 Service Unavailable|network timeout'
          ATTEMPT=1
          MAX_ATTEMPTS=3
          CI_EXIT=0

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "Running npm ci (attempt $ATTEMPT/$MAX_ATTEMPTS)..."
            set +e
            npm ci 2>&1 | tee .npm-ci.log
            CI_EXIT=${PIPESTATUS[0]}
            set -e

            if [ "$CI_EXIT" -eq 0 ]; then
              break
            fi

            if grep -Eiq "$TRANSIENT_PATTERN" .npm-ci.log && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              SLEEP_SEC=$((ATTEMPT * 15))
              echo "::warning::Transient npm/network failure detected; retrying npm ci in ${SLEEP_SEC}s."
              sleep "$SLEEP_SEC"
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi
            break
          done

          if [ "$CI_EXIT" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            if grep -Eiq "$TRANSIENT_PATTERN" .npm-ci.log; then
              echo "failure_kind=network_transient" >> "$GITHUB_OUTPUT"
            else
              echo "failure_kind=dependency_install_failure" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi

          set +e
          npm run build 2>&1 | tee .npm-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failure_kind=build_failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          rm -f .npm-ci.log .npm-build.log

      - name: Create or continue working branch
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: branch
        run: |
          BRANCH="claude/issue-${{ steps.find.outputs.issue_number }}"

          # Check if a previous branch exists with commits (partial work)
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Found existing branch $BRANCH — checking for previous work"
            git fetch origin "$BRANCH"
            PREV_COMMITS=$(git log origin/main..origin/"$BRANCH" --oneline 2>/dev/null | wc -l | tr -d ' ')

            if [ "$PREV_COMMITS" -gt 0 ]; then
              echo "Branch has $PREV_COMMITS previous commit(s) — continuing from prior work"
              git checkout -b "$BRANCH" origin/"$BRANCH"
              echo "has_prior_work=true" >> "$GITHUB_OUTPUT"
            else
              echo "Branch exists but has no commits — starting fresh"
              git push origin --delete "$BRANCH" 2>/dev/null || true
              git checkout -b "$BRANCH"
              echo "has_prior_work=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git checkout -b "$BRANCH"
            echo "has_prior_work=false" >> "$GITHUB_OUTPUT"
          fi

          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── Agent Execution ──────────────────────────────────────────────
      - name: Read issue for agent context
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: issue-body
        run: |
          gh issue view ${{ steps.find.outputs.issue_number }} -R "$REPO" \
            --json body,title,labels,milestone \
            > .claude-issue-context.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker prompt
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          IS_MANAGEMENT="${{ steps.find.outputs.issue_is_management || 'false' }}"
          if [ "$IS_MANAGEMENT" = "true" ]; then
            cat > .agent-worker-prompt.md <<'PROMPT'
          You are handling management ticket #${{ steps.find.outputs.issue_number }}: "${{ steps.find.outputs.issue_title }}".

          This is a workflow-management task, not a feature implementation task.

          ## Required actions
          1. Read `.claude-issue-context.json` and extract `Source issue: #N` metadata from the ticket body.
          2. Diagnose why the source issue is blocked/non-convergent.
          3. Use `gh` commands to update the source issue with a concrete unblock plan:
             - tighten acceptance criteria and file-level scope
             - correct labels (`agent:actionable`, `agent:needs-recovery`, `agent:management-needed`, `verify:pending`) based on current state
             - add a concise management comment with next autonomous action
          4. Update this management ticket with what you changed and why.
          5. Do not modify repository code, do not create commits, and do not create a PR.

          ## Evidence comment format
          Post one issue comment with:
          - Source issue diagnosis
          - Label/criteria updates applied
          - Remaining risks
          - Next autonomous step

          End comment with this metadata tag (valid JSON):
          <!-- agent_evidence = {"v":3,"issue":${{ steps.find.outputs.issue_number }},"role":"worker","run":"${{ github.run_id }}","provider":"${{ steps.provider.outputs.primary }}","status":"submitted|failed","attempt":${{ steps.strategy.outputs.attempts }},"focus":"management","meta_eval":"on_track|replanned|non_convergent","managerial_fix":"none|scope_split|test_plan_patch|requirements_patch","next_action":"retry|verify|decompose"} -->
          PROMPT
            exit 0
          fi

          cat > .agent-worker-prompt.md <<'PROMPT'
          You are implementing GitHub issue #${{ steps.find.outputs.issue_number }}: "${{ steps.find.outputs.issue_title }}".

          ## Adaptive Context
          - Milestone: ${{ steps.find.outputs.issue_milestone }}
          - Milestone complexity: ${{ steps.strategy.outputs.complexity }}
          - Attempt number (prior failures): ${{ steps.strategy.outputs.attempts }}
          - Max turns for this run: ${{ steps.strategy.outputs.effective_max_turns }}
          - Long-run mode: ${{ steps.strategy.outputs.long_run }}
          - Meta checkpoint interval (turns): ${{ steps.strategy.outputs.meta_check_interval }}
          - Focus mode: ${{ steps.strategy.outputs.focus }}
          - Test profile: ${{ steps.strategy.outputs.test_profile }}
          - Run id: ${{ github.run_id }}
          - Provider plan: primary=${{ steps.provider.outputs.primary }}, fallback=${{ steps.provider.outputs.fallback || 'none' }}

          ## Issue Context
          Read `.claude-issue-context.json` first.
          If this issue has prior failed attempts, prioritize narrowing scope and shipping one concrete, verifiable increment.

          ## Hard Requirements
          1. Make code changes (non-empty diff) and commit them.
          2. Run `npm run build`.
          3. Run targeted tests for changed behavior.
          4. If issue scope is too broad, implement the first concrete slice and document decomposition.
          5. Run periodic meta-evaluation checkpoints:
             - Every `${{ steps.strategy.outputs.meta_check_interval }}` turns, re-evaluate whether the plan is converging.
             - If 2 checkpoints in a row show low progress, apply a managerial fix (scope split, test-plan patch, or requirement clarification).
             - If still non-convergent, stop broad work and switch to narrow shippable slice or explicit decomposition.
          6. Post evidence comment on issue with exact metadata tag at the end.
          7. For feature/code changes, run live-provider functionality checks during implementation and after tests:
             - `./ask --json "Where is the query pipeline implemented and what are its stages?"`
             - Include pass/fail evidence for both checks in your issue comment.

          ## Rules
          - Focused minimal edits. No unrelated refactors.
          - Do not modify CLAUDE.md, AGENTS.md, or workflow files.
          - Start writing code within first 5 turns.
          - If blocked, still commit concrete progress (failing test, guardrail, or instrumentation).
          - Avoid shell pipes; redirect output to files and inspect with `tail`.

          ## Evidence Comment Format
          Post one issue comment with:
          - What changed
          - Build/test results
          - Live provider checks (during implementation + post-test)
          - Meta-evaluation summary (why plan was kept or changed)
          - Managerial fix applied (if any)
          - Risks and next follow-up

          End comment with this metadata tag (valid JSON):
          <!-- agent_evidence = {"v":3,"issue":${{ steps.find.outputs.issue_number }},"role":"worker","run":"${{ github.run_id }}","provider":"${{ steps.provider.outputs.primary }}","status":"submitted|no_changes|needs_decomposition|failed","attempt":${{ steps.strategy.outputs.attempts }},"focus":"${{ steps.strategy.outputs.focus }}","meta_eval":"on_track|replanned|non_convergent","managerial_fix":"none|scope_split|test_plan_patch|requirements_patch","next_action":"verify|retry|decompose|manual_review"} -->
          PROMPT

      - name: Install Codex CLI
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          (steps.provider.outputs.primary == 'codex' || steps.provider.outputs.fallback == 'codex')
        run: npm install -g @openai/codex

      - name: Prepare Codex auth (OAuth/API key)
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          (steps.provider.outputs.primary == 'codex' || steps.provider.outputs.fallback == 'codex')
        run: |
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "No CODEX_AUTH_JSON provided; Codex will use OPENAI_API_KEY if available."
            exit 0
          fi

          CODEX_HOME_DIR="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME_DIR"
          chmod 700 "$CODEX_HOME_DIR"
          printf '%s' "$CODEX_AUTH_JSON" > "$CODEX_HOME_DIR/auth.json"
          chmod 600 "$CODEX_HOME_DIR/auth.json"
          echo "CODEX_HOME=$CODEX_HOME_DIR" >> "$GITHUB_ENV"

          if jq -e '.auth_mode and .tokens' "$CODEX_HOME_DIR/auth.json" >/dev/null 2>&1; then
            echo "Prepared CODEX_HOME with OAuth auth payload."
          else
            echo "::warning::CODEX_AUTH_JSON does not look like a valid Codex auth.json payload."
          fi
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Run Claude worker (primary)
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          steps.provider.outputs.primary == 'claude'
        id: agent-claude-primary
        timeout-minutes: 45
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          show_full_output: true
          prompt: |
            Read `.agent-worker-prompt.md` and execute it completely.
            Implement, run verification commands, commit, and post evidence metadata for run `${{ github.run_id }}`.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns ${{ steps.strategy.outputs.effective_max_turns }}
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(gh *),Bash(npm *),Bash(npx *),Bash(git *),Bash(cat *),Bash(ls *),Bash(find *),Bash(wc *),Bash(head *),Bash(tail *),Bash(grep *),Bash(sed *),Bash(awk *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(echo *),Bash(tee *),Bash(rm *),Bash(./ask *),Bash(node dist/cli/index.js *)"
        continue-on-error: true

      - name: Run Codex worker (primary)
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          steps.provider.outputs.primary == 'codex'
        id: agent-codex-primary
        continue-on-error: true
        run: |
          set +e
          IS_MANAGEMENT="${{ steps.find.outputs.issue_is_management || 'false' }}"
          if [ "$IS_MANAGEMENT" = "true" ]; then
            TIMEOUT_MIN=${MANAGEMENT_CODEX_WORKER_TIMEOUT_MIN:-25}
          else
            TIMEOUT_MIN=${CODEX_WORKER_TIMEOUT_MIN:-45}
          fi
          HEARTBEAT_SEC=${WORKER_HEARTBEAT_SEC:-120}
          echo "timed_out=false" >> "$GITHUB_OUTPUT"

          START_TS=$(date -u +%s)
          (
            while true; do
              sleep "$HEARTBEAT_SEC"
              NOW_TS=$(date -u +%s)
              ELAPSED=$((NOW_TS - START_TS))
              echo "::notice::Codex primary still running (elapsed=${ELAPSED}s, timeout=${TIMEOUT_MIN}m)."
            done
          ) &
          HEARTBEAT_PID=$!

          set -o pipefail
          timeout "${TIMEOUT_MIN}m" stdbuf -oL -eL codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --skip-git-repo-check \
            --color never \
            -C "$PWD" \
            --model "${CODEX_MODEL:-gpt-5-codex}" \
            - < .agent-worker-prompt.md 2>&1 | tee .agent-codex-primary.log
          EXIT=$?
          set +o pipefail
          kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true
          wait "$HEARTBEAT_PID" 2>/dev/null || true
          set -e
          tail -n 150 .agent-codex-primary.log || true
          if [ "$EXIT" -eq 124 ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Codex primary worker timed out after ${TIMEOUT_MIN} minutes."
          fi
          if [ "$EXIT" -ne 0 ]; then
            exit "$EXIT"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Run Codex worker (fallback)
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          steps.provider.outputs.primary == 'claude' &&
          steps.provider.outputs.fallback == 'codex' &&
          steps.agent-claude-primary.outcome == 'failure'
        id: agent-codex-fallback
        continue-on-error: true
        run: |
          set +e
          IS_MANAGEMENT="${{ steps.find.outputs.issue_is_management || 'false' }}"
          if [ "$IS_MANAGEMENT" = "true" ]; then
            TIMEOUT_MIN=${MANAGEMENT_CODEX_WORKER_TIMEOUT_MIN:-25}
          else
            TIMEOUT_MIN=${CODEX_WORKER_TIMEOUT_MIN:-45}
          fi
          HEARTBEAT_SEC=${WORKER_HEARTBEAT_SEC:-120}
          echo "timed_out=false" >> "$GITHUB_OUTPUT"

          START_TS=$(date -u +%s)
          (
            while true; do
              sleep "$HEARTBEAT_SEC"
              NOW_TS=$(date -u +%s)
              ELAPSED=$((NOW_TS - START_TS))
              echo "::notice::Codex fallback still running (elapsed=${ELAPSED}s, timeout=${TIMEOUT_MIN}m)."
            done
          ) &
          HEARTBEAT_PID=$!

          set -o pipefail
          timeout "${TIMEOUT_MIN}m" stdbuf -oL -eL codex exec \
            --dangerously-bypass-approvals-and-sandbox \
            --skip-git-repo-check \
            --color never \
            -C "$PWD" \
            --model "${CODEX_MODEL:-gpt-5-codex}" \
            - < .agent-worker-prompt.md 2>&1 | tee .agent-codex-fallback.log
          EXIT=$?
          set +o pipefail
          kill "$HEARTBEAT_PID" >/dev/null 2>&1 || true
          wait "$HEARTBEAT_PID" 2>/dev/null || true
          set -e
          tail -n 150 .agent-codex-fallback.log || true
          if [ "$EXIT" -eq 124 ]; then
            echo "timed_out=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Codex fallback worker timed out after ${TIMEOUT_MIN} minutes."
          fi
          if [ "$EXIT" -ne 0 ]; then
            exit "$EXIT"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Run Claude worker (fallback)
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          steps.provider.outputs.primary == 'codex' &&
          steps.provider.outputs.fallback == 'claude' &&
          steps.agent-codex-primary.outcome == 'failure'
        id: agent-claude-fallback
        timeout-minutes: 45
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          show_full_output: true
          prompt: |
            Read `.agent-worker-prompt.md` and execute it completely.
            This is a fallback provider run after primary failure; bias toward narrower, verifiable scope.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns ${{ steps.strategy.outputs.effective_max_turns }}
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(gh *),Bash(npm *),Bash(npx *),Bash(git *),Bash(cat *),Bash(ls *),Bash(find *),Bash(wc *),Bash(head *),Bash(tail *),Bash(grep *),Bash(sed *),Bash(awk *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(echo *),Bash(tee *),Bash(rm *),Bash(./ask *),Bash(node dist/cli/index.js *)"
        continue-on-error: true

      - name: Resolve worker execution outcome
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: worker
        run: |
          PROVIDER=""
          OUTCOME="failure"

          if [ "${{ steps.agent-claude-primary.outcome }}" = "success" ]; then
            PROVIDER="claude"
            OUTCOME="success"
          elif [ "${{ steps.agent-codex-primary.outcome }}" = "success" ]; then
            PROVIDER="codex"
            OUTCOME="success"
          elif [ "${{ steps.agent-codex-fallback.outcome }}" = "success" ]; then
            PROVIDER="codex"
            OUTCOME="success"
          elif [ "${{ steps.agent-claude-fallback.outcome }}" = "success" ]; then
            PROVIDER="claude"
            OUTCOME="success"
          fi

          if [ -z "$PROVIDER" ]; then
            PROVIDER="${{ steps.provider.outputs.primary }}"
          fi

          echo "provider_used=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "Worker execution outcome: provider=$PROVIDER outcome=$OUTCOME"

      - name: Parse worker evidence metadata
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: evidence
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          RUN_ID="${{ github.run_id }}"

          RAW=$(gh issue view "$NUM" -R "$REPO" --json comments --jq \
            '.comments | reverse | map(.body) | map(select(test("agent_evidence\\s*=\\s*\\{"))) | .[]' | \
            head -n 20 || true)

          MATCH=$(echo "$RAW" | sed -n 's/.*agent_evidence = \({.*}\).*/\1/p' | \
            jq -c "select(.role==\"worker\" and (.run|tostring)==\"$RUN_ID\")" 2>/dev/null | head -n 1 || true)

          if [ -n "$MATCH" ]; then
            STATUS=$(echo "$MATCH" | jq -r '.status // "unknown"')
            NEXT_ACTION=$(echo "$MATCH" | jq -r '.next_action // "unknown"')
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "next_action=$NEXT_ACTION" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "source=issue_comment" >> "$GITHUB_OUTPUT"
          else
            LOG_MATCH=""
            for LOG in .agent-codex-primary.log .agent-codex-fallback.log; do
              if [ ! -f "$LOG" ]; then
                continue
              fi
              CAND=$(sed -n 's/.*agent_evidence = \({.*}\).*/\1/p' "$LOG" | \
                jq -c "select(.role==\"worker\" and ((has(\"run\")|not) or (.run|tostring)==\"$RUN_ID\"))" 2>/dev/null | tail -n 1 || true)
              if [ -n "$CAND" ]; then
                LOG_MATCH="$CAND"
                break
              fi
            done

            if [ -n "$LOG_MATCH" ]; then
              STATUS=$(echo "$LOG_MATCH" | jq -r '.status // "unknown"')
              NEXT_ACTION=$(echo "$LOG_MATCH" | jq -r '.next_action // "unknown"')
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "next_action=$NEXT_ACTION" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "source=worker_log" >> "$GITHUB_OUTPUT"
            else
              echo "status=missing" >> "$GITHUB_OUTPUT"
              echo "next_action=unknown" >> "$GITHUB_OUTPUT"
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "source=none" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-agent quality gates
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: gates
        continue-on-error: true
        run: |
          run_with_timeout() {
            local minutes="$1"
            shift
            timeout "${minutes}m" "$@"
          }

          run_live_provider_query() {
            local phase="$1"
            local out=".live-provider-${phase}.json"
            local err=".live-provider-${phase}.err"
            local query="Where is the query pipeline implemented and what are its stages?"
            set +e
            run_with_timeout 8 ./ask --json "$query" > "$out" 2> "$err"
            local ask_exit=$?
            set -e
            if [ "$ask_exit" -ne 0 ] && grep -Eiq 'EQUERY_TIMEOUT|timed out after 120000ms' "$out" "$err"; then
              echo "::warning::Live-provider query timed out during ${phase}; applying recovery and retrying with extended timeout."
              run_with_timeout 6 node dist/cli/index.js doctor --heal >/tmp/live-provider-heal-${phase}.log 2>&1 || true
              set +e
              run_with_timeout 12 ./ask --json --timeout 180000 "$query" > "$out" 2> "$err"
              ask_exit=$?
              set -e
            fi
            if [ "$ask_exit" -ne 0 ]; then
              echo "::error::Live-provider query failed during ${phase}."
              tail -n 80 "$err" || true
              return 1
            fi
            if [ ! -s "$out" ]; then
              echo "::error::Live-provider query output was empty during ${phase}."
              tail -n 80 "$err" || true
              return 1
            fi
            if grep -Eiq 'unverified_by_trace\(provider_unavailable\)|Provider check skipped \(offline mode\)' "$out" "$err"; then
              echo "::error::Live-provider query indicates provider unavailable/offline during ${phase}."
              tail -n 120 "$out" || true
              tail -n 120 "$err" || true
              return 1
            fi
            echo "Live-provider query passed (${phase})."
          }

          run_live_provider_system_tests_strict() {
            local report=".live-provider-system-vitest.json"
            rm -f "$report"
            run_with_timeout 25 npx vitest run src/__tests__/librarian_live_provider.system.test.ts \
              --testNamePattern "bootstrap and become ready|query for context" \
              --reporter=json \
              --outputFile "$report"
            if [ ! -s "$report" ]; then
              echo "::error::Mandatory live-provider system test report was not produced."
              return 1
            fi
            node -e '
              const fs = require("fs");
              const p = process.argv[1];
              const raw = fs.readFileSync(p, "utf8");
              const data = JSON.parse(raw);
              const pending = Number(data.numPendingTests ?? data.numPendingTestCases ?? 0);
              const todo = Number(data.numTodoTests ?? data.numTodoTestCases ?? 0);
              const skipped = pending + todo;
              console.log(`Mandatory live-provider skip check: pending=${pending} todo=${todo} total_skipped=${skipped}`);
              if (skipped > 0) process.exit(1);
            ' "$report"
          }

          NUM=${{ steps.find.outputs.issue_number }}
          BRANCH=${{ steps.branch.outputs.name }}
          IS_MANAGEMENT="${{ steps.find.outputs.issue_is_management || 'false' }}"
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "should_create_pr=false" >> "$GITHUB_OUTPUT"
          echo "no_changes=false" >> "$GITHUB_OUTPUT"

          if [ "$IS_MANAGEMENT" = "true" ]; then
            echo "Management ticket mode: skipping code quality gates and PR requirement."
            echo "quality_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log origin/main.."$BRANCH" --oneline 2>/dev/null | wc -l | tr -d ' ')
          CHANGED=$(git diff --name-only origin/main.."$BRANCH" | sed '/^\s*$/d' || true)
          CHANGED_COUNT=$(echo "$CHANGED" | sed '/^\s*$/d' | wc -l | tr -d ' ')
          if [ -z "$CHANGED" ]; then CHANGED_COUNT=0; fi
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "changed_count=$CHANGED_COUNT" >> "$GITHUB_OUTPUT"

          REQUIRE_LIVE_PROVIDER=false
          FEATURE_CHANGED=$(echo "$CHANGED" | grep -E '^(src/|scripts/|ask|package\.json|config/)' | grep -Ev '^(docs/|src/__tests__/|\.github/)' || true)
          if [ -n "$FEATURE_CHANGED" ]; then
            REQUIRE_LIVE_PROVIDER=true
          fi
          echo "require_live_provider=$REQUIRE_LIVE_PROVIDER" >> "$GITHUB_OUTPUT"

          if [ "$COMMITS" -eq 0 ] && [ "${{ steps.worker.outputs.outcome }}" != "success" ]; then
            echo "No agent commits and worker failed. Skip quality gates."
            exit 0
          fi

          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits made by agent. Checking for uncommitted changes..."
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "wip: agent partial work on #$NUM (uncommitted changes)"
              COMMITS=1
            else
              echo "No changes produced. Nothing to gate."
              echo "no_changes=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$REQUIRE_LIVE_PROVIDER" = "true" ]; then
            echo "Running mandatory live-provider check during implementation stage..."
            run_live_provider_query "during-implementation"
          fi

          echo "Running hard gates on produced changes..."
          run_with_timeout 12 npm run build
          run_with_timeout 10 npx tsc --noEmit

          CHANGED_TESTS=$(echo "$CHANGED" | grep -E '^src/.*\.(test|spec)\.(ts|tsx|js)$' || true)
          if [ -n "$CHANGED_TESTS" ]; then
            mapfile -t CHANGED_TEST_ARRAY < <(echo "$CHANGED_TESTS" | sed '/^\s*$/d')
            echo "Running changed test files:"
            printf ' - %s\n' "${CHANGED_TEST_ARRAY[@]}"
            run_with_timeout 20 npm test -- --run "${CHANGED_TEST_ARRAY[@]}"
          else
            # Derive likely test files from changed source files and run only those that exist.
            mapfile -t SOURCE_CHANGED < <(echo "$CHANGED" | grep -E '^src/.*\.(ts|tsx|js)$' | sed '/^\s*$/d')
            DERIVED=""
            for SRC in "${SOURCE_CHANGED[@]}"; do
              NO_EXT="${SRC%.*}"
              BASE="$(basename "$NO_EXT")"
              DIR="$(dirname "$NO_EXT")"
              for CAND in \
                "$DIR/__tests__/${BASE}.test.ts" \
                "$DIR/__tests__/${BASE}.spec.ts" \
                "$DIR/${BASE}.test.ts" \
                "$DIR/${BASE}.spec.ts"; do
                if [ -f "$CAND" ]; then
                  DERIVED="${DERIVED}${CAND}"$'\n'
                fi
              done
            done
            DERIVED=$(echo "$DERIVED" | awk '!seen[$0]++' | sed '/^\s*$/d' || true)
            if [ -n "$DERIVED" ]; then
              mapfile -t DERIVED_ARRAY < <(echo "$DERIVED")
              echo "Running derived related test files:"
              printf ' - %s\n' "${DERIVED_ARRAY[@]}"
              run_with_timeout 20 npm test -- --run "${DERIVED_ARRAY[@]}"
            else
              PROFILE="${{ steps.strategy.outputs.test_profile }}"
              if [ "$PROFILE" = "scale" ]; then
                run_with_timeout 20 npm test -- --run src/__tests__/provider_failures.test.ts src/__tests__/issue_quality_analysis_script.test.ts src/__tests__/performance_regression.test.ts
              elif [ "$PROFILE" = "integration" ]; then
                run_with_timeout 20 npm test -- --run src/__tests__/provider_failures.test.ts src/__tests__/issue_quality_analysis_script.test.ts src/__tests__/semantic_composition_selector.integration.test.ts
              else
                run_with_timeout 20 npm test -- --run src/__tests__/provider_failures.test.ts src/__tests__/issue_quality_analysis_script.test.ts
              fi
            fi
          fi

          if [ "$REQUIRE_LIVE_PROVIDER" = "true" ]; then
            echo "Running mandatory live-provider system functionality tests..."
            run_live_provider_system_tests_strict
            echo "Running mandatory post-test live-provider query check..."
            run_live_provider_query "post-tests"
          fi

          echo "quality_ok=true" >> "$GITHUB_OUTPUT"
          echo "should_create_pr=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # ── Post-Agent: Create PR ────────────────────────────────────────
      - name: Check for changes and create PR
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          steps.retries.outputs.shelved != 'true' &&
          steps.readiness.outputs.ready != 'false' &&
          inputs.dry_run != true && inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true' &&
          steps.gates.outcome == 'success' &&
          steps.gates.outputs.should_create_pr == 'true'
        id: create-pr
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          BRANCH=${{ steps.branch.outputs.name }}
          echo "push_failed=false" >> "$GITHUB_OUTPUT"
          echo "pr_create_failed=false" >> "$GITHUB_OUTPUT"
          echo "pr_create_error_kind=none" >> "$GITHUB_OUTPUT"

          # Re-authenticate git — claude-code-action may revoke its token on completion.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # CI must bypass local developer hooks when pushing automation branches.
          export LEFTHOOK=0

          # Push branch — use force-with-lease to preserve prior work while allowing
          # history rewrite if needed, fall back to regular push for continuation
          set +e
          PUSH_OUTPUT=$( (git push --no-verify -u origin "$BRANCH" --force-with-lease 2>/dev/null || \
            git push --no-verify -u origin "$BRANCH" 2>/dev/null || \
            git push --no-verify -u origin "$BRANCH" --force) 2>&1 )
          PUSH_EXIT=$?
          set -e
          if [ "$PUSH_EXIT" -ne 0 ]; then
            echo "::warning::Branch push failed; skipping PR creation this run."
            echo "$PUSH_OUTPUT"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            echo "push_failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Create PR if one doesn't exist
          EXISTING_PR=$(gh pr list -R "$REPO" --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for this branch"
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            # Write PR body to file — heredocs in $(cat <<EOF) fail in CI sandbox
            cat > .pr-body.md << 'PRBODY'
          ## Summary
          Automated implementation of issue.

          ## Agent Run
          - **Model:** claude-sonnet-4-6

          ## Verification
          This PR needs independent verification before merge.
          The Agent Verify workflow will check it automatically.
          PRBODY
            # Append dynamic fields (issue number, links) after the static template
            {
              echo ""
              echo "Closes #$NUM"
              echo ""
              echo "- **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- **Turns:** ${{ steps.strategy.outputs.effective_max_turns }}"
              echo "- **Provider Used:** ${{ steps.worker.outputs.provider_used }}"
              echo "- **Focus Mode:** ${{ steps.strategy.outputs.focus }}"
              echo "- **Milestone:** ${{ steps.find.outputs.issue_milestone }}"
              echo "- **Complexity:** ${{ steps.strategy.outputs.complexity }}"
              echo ""
              echo "<!-- agent_pr = {\"issue\": $NUM, \"agent\": \"worker\", \"run_id\": \"${{ github.run_id }}\"} -->"
            } >> .pr-body.md

            set +e
            PR_URL=$(gh pr create -R "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "fix: implement #$NUM — ${{ steps.find.outputs.issue_title }}" \
              --body-file .pr-body.md 2>&1)
            PR_EXIT=$?
            set -e
            rm -f .pr-body.md

            if [ "$PR_EXIT" -ne 0 ]; then
              echo "::warning::PR creation failed."
              echo "$PR_URL"
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              echo "pr_create_failed=true" >> "$GITHUB_OUTPUT"
              if echo "$PR_URL" | grep -Eqi 'createPullRequest|not permitted to create or approve pull requests'; then
                echo "pr_create_error_kind=permissions" >> "$GITHUB_OUTPUT"
              else
                echo "pr_create_error_kind=unknown" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi

            PR_NUM=$(echo "$PR_URL" | grep -oP '/pull/\K\d+' || echo "")
            echo "Created PR #$PR_NUM (URL: $PR_URL)"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

          # Label issue for verification
          gh issue edit "$NUM" -R "$REPO" \
            --remove-label "agent:claimed" \
            --add-label "verify:pending"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch verifier for submitted PR
        if: steps.create-pr.outputs.pr_number && inputs.dry_run != true && inputs.dry_run != 'true'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          ENABLE_FALLBACK_INPUT="${{ inputs.enable_fallback }}"
          VERIFY_FALLBACK=true
          if [ "$ENABLE_FALLBACK_INPUT" = "false" ] || [ "$ENABLE_FALLBACK_INPUT" = "0" ]; then
            VERIFY_FALLBACK=false
          fi

          gh workflow run agent-verify.yml -R "$REPO" \
            -f issue_number="$NUM" \
            -f agent_provider="auto" \
            -f enable_fallback="$VERIFY_FALLBACK" \
            -f batch_remaining="1"

          echo "Triggered Agent Verify Loop for issue #$NUM."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Outcome Recording ────────────────────────────────────────────
      - name: Record outcome
        if: always() && steps.find.outputs.issue_number && job.status != 'cancelled'
        id: outcome
        run: |
          NUM=${NUM:-}
          PR=${PR:-}
          WORKER_OUTCOME=${WORKER_OUTCOME:-unknown}
          PROVIDER_USED=${PROVIDER_USED:-unknown}
          PUSH_FAILED=${PUSH_FAILED:-false}
          PR_CREATE_FAILED=${PR_CREATE_FAILED:-false}
          PR_CREATE_ERROR_KIND=${PR_CREATE_ERROR_KIND:-none}
          GATE_OUTCOME=${GATE_OUTCOME:-unknown}
          EVIDENCE_FOUND=${EVIDENCE_FOUND:-false}
          EVIDENCE_STATUS=${EVIDENCE_STATUS:-missing}
          EVIDENCE_SOURCE=${EVIDENCE_SOURCE:-none}
          NEXT_ACTION=${NEXT_ACTION:-unknown}
          ATTEMPTS=${ATTEMPTS:-0}
          GATE_NO_CHANGES=${GATE_NO_CHANGES:-false}
          GATE_COMMITS=${GATE_COMMITS:-0}
          GATE_CHANGED_COUNT=${GATE_CHANGED_COUNT:-0}
          IS_MANAGEMENT=${IS_MANAGEMENT:-false}
          HAS_CODEX_AVAILABLE=${HAS_CODEX_AVAILABLE:-false}
          PROVIDER_PRIMARY=${PROVIDER_PRIMARY:-unknown}
          PROVIDER_FALLBACK=${PROVIDER_FALLBACK:-}
          BREAKER_OPEN=${BREAKER_OPEN:-false}
          IS_DRY_RUN=${IS_DRY_RUN:-false}
          DEPS_BLOCKED=${DEPS_BLOCKED:-false}
          RETRIES_SHELVED=${RETRIES_SHELVED:-false}
          READINESS_READY=${READINESS_READY:-true}
          READINESS_SCORE=${READINESS_SCORE:-unknown}
          STRATEGY_FOCUS=${STRATEGY_FOCUS:-unknown}
          RUN_ID=${RUN_ID:-}
          RUN_URL=${RUN_URL:-}
          BUILD_FAILED=${BUILD_FAILED:-false}
          BUILD_FAILURE_KIND=${BUILD_FAILURE_KIND:-none}
          CODEX_PRIMARY_TIMED_OUT=${CODEX_PRIMARY_TIMED_OUT:-false}
          CODEX_FALLBACK_TIMED_OUT=${CODEX_FALLBACK_TIMED_OUT:-false}
          CLAUDE_AUTH_HINT=false
          WORKER_TIMED_OUT=false

          echo "escalate=false" >> "$GITHUB_OUTPUT"
          echo "escalation_reason=none" >> "$GITHUB_OUTPUT"

          if ! [[ "$ATTEMPTS" =~ ^[0-9]+$ ]]; then ATTEMPTS=0; fi
          if ! [[ "$GATE_COMMITS" =~ ^[0-9]+$ ]]; then GATE_COMMITS=0; fi
          if ! [[ "$GATE_CHANGED_COUNT" =~ ^[0-9]+$ ]]; then GATE_CHANGED_COUNT=0; fi
          if [ "$CODEX_PRIMARY_TIMED_OUT" = "true" ] || [ "$CODEX_FALLBACK_TIMED_OUT" = "true" ]; then
            WORKER_TIMED_OUT=true
          fi

          if [ "$WORKER_OUTCOME" != "success" ] && [ "$PROVIDER_USED" = "claude" ]; then
            if gh run view "$RUN_ID" -R "$REPO" --log 2>/dev/null | grep -Eq 'OAuth token has expired|authentication_error'; then
              CLAUDE_AUTH_HINT=true
            fi
            if [ "$PROVIDER_PRIMARY" = "claude" ] && [ -z "$PROVIDER_FALLBACK" ]; then
              CLAUDE_AUTH_HINT=true
            fi
          fi

          if [ "$BREAKER_OPEN" = "true" ]; then
            echo "result=skipped-breaker" >> "$GITHUB_OUTPUT"
            echo "Outcome skipped due to open circuit breaker."
            exit 0
          fi
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "result=skipped-dry-run" >> "$GITHUB_OUTPUT"
            echo "Outcome skipped in dry-run mode."
            exit 0
          fi
          if [ "$DEPS_BLOCKED" = "true" ]; then
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            echo "Outcome blocked by dependencies."
            exit 0
          fi
          if [ "$RETRIES_SHELVED" = "true" ]; then
            echo "result=needs-management" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "escalation_reason=retry_exhausted" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --remove-label "agent:actionable" \
              --add-label "agent:needs-decomposition" \
              --add-label "agent:management-needed" \
              --add-label "agent:manual-review-needed" \
              --add-label "triage/missing-essentials"
            {
              echo "**Agent Work Loop** escalated this issue after retry exhaustion."
              echo ""
              echo "- **Attempts observed:** $ATTEMPTS"
              echo "- **Escalation reason:** retry_exhausted"
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"needs_decomposition\",\"meta_eval\":\"non_convergent\",\"managerial_fix\":\"scope_split\",\"next_action\":\"manual_review\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
            exit 0
          fi
          if [ "$READINESS_READY" = "false" ]; then
            echo "result=needs-management" >> "$GITHUB_OUTPUT"
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "escalation_reason=readiness_gap" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending" \
              --remove-label "agent:actionable" \
              --add-label "agent:needs-recovery" \
              --add-label "agent:management-needed" \
              --add-label "agent:manual-review-needed" \
              --add-label "triage/missing-essentials"
            {
              echo "**Agent Work Loop** escalated this issue due to readiness gaps."
              echo ""
              echo "- **Readiness score:** $READINESS_SCORE/3"
              echo "- **Escalation reason:** readiness_gap"
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"non_convergent\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"manual_review\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
            exit 0
          fi

          if [ "$BUILD_FAILED" = "true" ]; then
            if [ "$BUILD_FAILURE_KIND" = "network_transient" ]; then
              echo "result=retry-infra" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=dependency_install_transient" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --remove-label "agent:management-needed" \
                --remove-label "agent:manual-review-needed" \
                --remove-label "agent:infra-blocked" \
                --remove-label "agent:provider-auth-failure" \
                --add-label "agent:actionable" \
                --add-label "triage/ready" || true
              {
                echo "**Agent Work Loop** — transient dependency/install infrastructure failure."
                echo ""
                echo "- **Failure kind:** $BUILD_FAILURE_KIND"
                echo "- **Action:** issue re-queued automatically for retry"
                echo "- **Next:** continue autonomous chain"
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"none\",\"next_action\":\"retry\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
              exit 0
            else
              echo "result=infra-failure" >> "$GITHUB_OUTPUT"
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=dependency_install_failure" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --add-label "agent:actionable" \
                --add-label "triage/ready" \
                --add-label "agent:infra-blocked" \
                --add-label "agent:management-needed" \
                --add-label "agent:manual-review-needed" || true
              {
                echo "**Agent Work Loop** — dependency/build setup failed before worker execution."
