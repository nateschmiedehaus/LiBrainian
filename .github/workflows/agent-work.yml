                echo "- **Closed ticket:** $SHOULD_CLOSE"
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"submitted\",\"meta_eval\":\"on_track\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
