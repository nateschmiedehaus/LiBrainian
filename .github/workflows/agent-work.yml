name: Agent Work Loop

# Autonomous issue implementation loop.
# Finds the highest-priority ready issue, dispatches a Claude agent to implement it,
# creates a PR, and labels the issue for verification.
#
# Auth: Requires CLAUDE_CODE_OAUTH_TOKEN (Max subscription OAuth) in repo secrets.
# If you prefer API key auth, set ANTHROPIC_API_KEY instead.

on:
  schedule:
    - cron: '15 */3 * * *'  # Every 3 hours at :15
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number to work on (blank = auto-select)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — find issue but do not dispatch agent'
        required: false
        default: false
        type: boolean
      max_turns:
        description: 'Max agent turns (default 25)'
        required: false
        default: '25'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Only one work loop at a time. New triggers queue (don't cancel in-progress work).
concurrency:
  group: agent-work-loop
  cancel-in-progress: false

env:
  REPO: nateschmiedehaus/LiBrainian
  # Circuit breaker: stop dispatching if recent runs keep failing
  MAX_CONSECUTIVE_FAILURES: 3

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      issue_number: ${{ steps.find.outputs.issue_number }}
      issue_title: ${{ steps.find.outputs.issue_title }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      branch: ${{ steps.branch.outputs.name }}
      outcome: ${{ steps.outcome.outputs.result }}

    steps:
      # ── Circuit Breaker ──────────────────────────────────────────────
      # Counts CONSECUTIVE failures from the most recent run backwards.
      # One success auto-clears the breaker — no manual intervention needed.
      - name: Circuit breaker — check consecutive failures
        id: breaker
        run: |
          CONSECUTIVE=0
          for CONC in $(gh run list -R "$REPO" -w "Agent Work Loop" --limit 10 \
            --json conclusion --jq '.[].conclusion'); do
            if [ "$CONC" = "failure" ]; then
              CONSECUTIVE=$((CONSECUTIVE + 1))
            else
              break
            fi
          done

          if [ "$CONSECUTIVE" -ge "$MAX_CONSECUTIVE_FAILURES" ]; then
            echo "Circuit breaker OPEN — $CONSECUTIVE consecutive failures."

            # Auto-heal check: if workflow files changed after the last failure,
            # the fix is likely deployed — force the breaker closed
            LAST_FAIL_TIME=$(gh run list -R "$REPO" -w "Agent Work Loop" --limit 1 \
              --json conclusion,updatedAt --jq '.[0] | select(.conclusion == "failure") | .updatedAt' || true)
            LAST_WORKFLOW_CHANGE=$(gh api "repos/$REPO/commits?path=.github/workflows/agent-work.yml&per_page=1" \
              --jq '.[0].commit.committer.date' 2>/dev/null || true)

            if [ -n "$LAST_FAIL_TIME" ] && [ -n "$LAST_WORKFLOW_CHANGE" ]; then
              if [[ "$LAST_WORKFLOW_CHANGE" > "$LAST_FAIL_TIME" ]]; then
                echo "Auto-heal: workflow changed after last failure ($LAST_WORKFLOW_CHANGE > $LAST_FAIL_TIME). Resetting breaker."
                echo "open=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "Circuit breaker closed ($CONSECUTIVE consecutive failures)"
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Abort if circuit breaker open
        if: steps.breaker.outputs.open == 'true'
        run: |
          echo "::warning::Circuit breaker is open — ${{ env.MAX_CONSECUTIVE_FAILURES }} consecutive failures. Will auto-heal when workflow is updated."
          exit 0

      # ── Find Issue ───────────────────────────────────────────────────
      - name: Find next ready issue
        if: steps.breaker.outputs.open != 'true'
        id: find
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            # Manual override — work on specific issue
            NUM="${{ inputs.issue_number }}"
            TITLE=$(gh issue view "$NUM" -R "$REPO" --json title --jq '.title')
            echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
            echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"
            echo "Selected (manual): #$NUM — $TITLE"
            exit 0
          fi

          # Auto-select: find issues that are ready + actionable + not claimed
          # Priority: M0 > M1 > M2 > M3 > M4, then by issue number (oldest first)
          ISSUES=$(gh issue list -R "$REPO" --state open \
            --label "triage/ready" --label "agent:actionable" \
            --limit 50 \
            --json number,title,labels,milestone \
            --jq '
              [.[] |
                select(.labels | map(.name) |
                  (contains(["agent:claimed"]) | not) and
                  (contains(["lifecycle/frozen"]) | not) and
                  (contains(["agent:blocked"]) | not) and
                  (contains(["verify:pending"]) | not)
                ) |
                {
                  number,
                  title,
                  milestone: (.milestone.title // "none"),
                  milestone_order: (
                    if .milestone.title == "M0: Dogfood-Ready" then 0
                    elif .milestone.title == "M1: Construction MVP" then 1
                    elif .milestone.title == "M2: Agent Integration" then 2
                    elif .milestone.title == "M3: Scale & Epistemics" then 3
                    elif .milestone.title == "M4: World-Class" then 4
                    else 5 end
                  )
                }
              ] | sort_by(.milestone_order, .number) | first
            ')

          if [ -z "$ISSUES" ] || [ "$ISSUES" = "null" ]; then
            echo "No ready+actionable issues found. Nothing to dispatch."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NUM=$(echo "$ISSUES" | jq -r '.number')
          TITLE=$(echo "$ISSUES" | jq -r '.title')
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "Selected (auto): #$NUM — $TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for dependency blockers
        if: steps.find.outputs.issue_number && steps.breaker.outputs.open != 'true'
        id: deps
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          BODY=$(gh issue view "$NUM" -R "$REPO" --json body --jq '.body')

          # Extract "Depends on: #X" or "Blocked by: #X" references
          DEPS=$(echo "$BODY" | grep -ioP '(?:depends on|blocked by|requires)\s*#\K\d+' || true)

          for DEP in $DEPS; do
            STATE=$(gh issue view "$DEP" -R "$REPO" --json state --jq '.state')
            if [ "$STATE" = "OPEN" ]; then
              echo "::warning::Issue #$NUM is blocked by open dependency #$DEP"
              # Label it blocked and find next issue
              gh issue edit "$NUM" -R "$REPO" --add-label "agent:blocked"
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "blocked=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if no issue or blocked or dry run
        if: >-
          !steps.find.outputs.issue_number ||
          steps.deps.outputs.blocked == 'true' ||
          inputs.dry_run == 'true' ||
          steps.breaker.outputs.open == 'true'
        run: |
          echo "Skipping agent dispatch."
          echo "  Issue: ${{ steps.find.outputs.issue_number || 'none' }}"
          echo "  Blocked: ${{ steps.deps.outputs.blocked }}"
          echo "  Dry run: ${{ inputs.dry_run }}"
          echo "  Breaker: ${{ steps.breaker.outputs.open }}"

      # ── Claim & Setup ───────────────────────────────────────────────
      - name: Claim issue
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          gh issue edit "$NUM" -R "$REPO" --add-label "agent:claimed"
          {
            echo "**Agent Work Loop** claimed this issue."
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Triggered:** ${{ github.event_name }}"
            echo "- **Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Working on implementation now..."
          } > .claim-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .claim-comment.md
          rm -f .claim-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Free disk space — LiBrainian + node_modules need ~4GB
      - name: Free disk space
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          echo "Disk space available: $(df -h / | tail -1 | awk '{print $4}')"

      - uses: actions/checkout@v4
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'

      - uses: actions/setup-node@v4
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        run: npm ci && npm run build

      - name: Create working branch
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: branch
        run: |
          BRANCH="claude/issue-${{ steps.find.outputs.issue_number }}"
          # Clean up stale remote branch from previous failed attempts
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            echo "Stale remote branch $BRANCH found — deleting for fresh start"
            git push origin --delete "$BRANCH" 2>/dev/null || true
          fi
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── Agent Execution ──────────────────────────────────────────────
      - name: Read issue for agent context
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: issue-body
        run: |
          gh issue view ${{ steps.find.outputs.issue_number }} -R "$REPO" \
            --json body,title,labels,milestone \
            > .claude-issue-context.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run agent
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: agent
        uses: anthropics/claude-code-action@v1
        with:
          # Auth: OAuth token from Max subscription
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          prompt: |
            You are implementing GitHub issue #${{ steps.find.outputs.issue_number }}: "${{ steps.find.outputs.issue_title }}"

            ## Issue Context
            Read the full issue at .claude-issue-context.json for details. The issue body
            contains an "Agent Implementation Brief" with exact file paths, line numbers,
            and step-by-step implementation instructions. Follow those closely.

            ## Your Task
            1. Read .claude-issue-context.json to get the full issue and acceptance criteria
            2. Read the key files mentioned in the issue's implementation brief
            3. Implement the fix/feature using Edit and Write tools (these are pre-approved)
            4. Run `npm run build` to verify compilation
            5. Run relevant tests: `npm test -- --testPathPattern <relevant_pattern>`
            6. IMPORTANT: Commit your changes with git. Use a file for the commit message
               to avoid multiline shell issues:
               ```
               git add -A
               echo -e "fix(scope): description of changes\n\nCloses #${{ steps.find.outputs.issue_number }}" > .commit-msg
               git commit -F .commit-msg
               rm .commit-msg
               ```
               Do NOT use heredocs or multiline -m flags — they get permission-denied.

            ## Tools Available
            - Edit, Write: for modifying/creating files (pre-approved, use these!)
            - Read, Grep, Glob: for reading code
            - Bash: for git, npm, gh commands (see allowed patterns)

            ## Rules
            - Use Edit tool for file modifications. Do NOT use sed/awk for code edits.
            - Make focused, minimal changes. Do not refactor surrounding code.
            - Do not modify CLAUDE.md, AGENTS.md, or workflow files.
            - If blocked, commit what you have and explain in the commit message.
            - You MUST commit before finishing. Uncommitted changes may be lost.
            - IMPORTANT: Do NOT pipe commands (e.g., `npm test | tail`). Pipes get
              permission-denied. Instead, redirect to a file and read it:
              ```
              npm test > .test-output.txt 2>&1; tail -20 .test-output.txt
              ```

            ## Evidence
            After implementing, post a comment on issue #${{ steps.find.outputs.issue_number }}.
            IMPORTANT: Use Write tool to create `.evidence-comment.md` with your evidence,
            then run: `gh issue comment ${{ steps.find.outputs.issue_number }} --body-file .evidence-comment.md`
            Do NOT use heredocs or $(cat <<EOF) — they get blocked by the sandbox.
            Include: what you changed, test results, and caveats for the verifier.

          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns ${{ inputs.max_turns || '25' }}
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(gh *),Bash(npm *),Bash(npx *),Bash(git *),Bash(cat *),Bash(ls *),Bash(find *),Bash(wc *),Bash(head *),Bash(tail *),Bash(grep *),Bash(sed *),Bash(awk *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(echo *),Bash(tee *),Bash(rm *)"

          # Standard code tools — no MCP (avoids bootstrap/disk/memory issues in CI)
          # LiBrainian MCP requires bootstrapped index which is too heavy for CI runners.
          # The agent uses built-in Read/Grep/Glob which are sufficient for focused issue work.

        continue-on-error: true  # Don't fail the whole job on agent error (exit code 5 bug)

      # ── Post-Agent: Create PR ────────────────────────────────────────
      - name: Check for changes and create PR
        if: >-
          steps.find.outputs.issue_number &&
          steps.deps.outputs.blocked != 'true' &&
          inputs.dry_run != 'true' &&
          steps.breaker.outputs.open != 'true'
        id: create-pr
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          BRANCH=${{ steps.branch.outputs.name }}

          # Re-authenticate git — claude-code-action revokes its token on completion
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # Check if the agent made any commits
          COMMITS=$(git log origin/main.."$BRANCH" --oneline 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits made by agent. Checking for uncommitted changes..."
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "wip: agent partial work on #$NUM (uncommitted changes)"
            else
              echo "No changes at all. Agent may have failed."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Push branch — force push is safe here because we just created this branch
          # and any stale remote was already deleted in the "Create working branch" step
          git push -u origin "$BRANCH" --force-with-lease 2>/dev/null || \
            git push -u origin "$BRANCH" --force 2>/dev/null || \
            git push -u origin "$BRANCH"

          # Create PR if one doesn't exist
          EXISTING_PR=$(gh pr list -R "$REPO" --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for this branch"
            echo "pr_number=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            # Write PR body to file — heredocs in $(cat <<EOF) fail in CI sandbox
            cat > .pr-body.md << 'PRBODY'
          ## Summary
          Automated implementation of issue.

          ## Agent Run
          - **Model:** claude-sonnet-4-6

          ## Verification
          This PR needs independent verification before merge.
          The Agent Verify workflow will check it automatically.
          PRBODY
            # Append dynamic fields (issue number, links) after the static template
            {
              echo ""
              echo "Closes #$NUM"
              echo ""
              echo "- **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- **Turns:** ${{ inputs.max_turns || '25' }}"
              echo ""
              echo "<!-- agent_pr = {\"issue\": $NUM, \"agent\": \"worker\", \"run_id\": \"${{ github.run_id }}\"} -->"
            } >> .pr-body.md

            PR_URL=$(gh pr create -R "$REPO" \
              --base main \
              --head "$BRANCH" \
              --title "fix: implement #$NUM — ${{ steps.find.outputs.issue_title }}" \
              --body-file .pr-body.md 2>&1)
            rm -f .pr-body.md
            PR_NUM=$(echo "$PR_URL" | grep -oP '/pull/\K\d+' || echo "")
            echo "Created PR #$PR_NUM (URL: $PR_URL)"
            echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          fi

          # Label issue for verification
          gh issue edit "$NUM" -R "$REPO" \
            --remove-label "agent:claimed" \
            --add-label "verify:pending"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Outcome Recording ────────────────────────────────────────────
      - name: Record outcome
        if: always() && steps.find.outputs.issue_number
        id: outcome
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          PR=${{ steps.create-pr.outputs.pr_number }}

          if [ -n "$PR" ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            {
              echo "**Agent Work Loop** completed."
              echo ""
              echo "- **PR:** #$PR"
              echo "- **Status:** Implementation submitted"
              echo "- **Next:** Awaiting independent verification"
              echo ""
              echo "<!-- agent_evidence = {\"v\":1,\"issue\":$NUM,\"role\":\"worker\",\"pr\":$PR,\"run\":\"${{ github.run_id }}\",\"status\":\"submitted\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          else
            echo "result=no-changes" >> "$GITHUB_OUTPUT"
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "agent:claimed" \
              --remove-label "verify:pending"
            {
              echo "**Agent Work Loop** did not produce changes for this issue."
              echo ""
              echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "- **Reason:** Agent completed without making code changes"
              echo ""
              echo "Returning to ready state."
              echo ""
              echo "<!-- agent_evidence = {\"v\":1,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"${{ github.run_id }}\",\"status\":\"no_changes\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unclaim on failure
        if: failure() && steps.find.outputs.issue_number
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          gh issue edit "$NUM" -R "$REPO" \
            --remove-label "agent:claimed" \
            --remove-label "verify:pending"
          {
            echo "**Agent Work Loop** failed."
            echo ""
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- **Error:** Workflow failed — check run logs"
            echo ""
            echo "Returning to ready state for retry."
            echo ""
            echo "<!-- agent_evidence = {\"v\":1,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"${{ github.run_id }}\",\"status\":\"failed\"} -->"
          } > .failure-comment.md
          gh issue comment "$NUM" -R "$REPO" --body-file .failure-comment.md
          rm -f .failure-comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
