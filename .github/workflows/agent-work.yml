              echo "Action needed:"
              echo "1. Allow GitHub Actions token to create pull requests (or provide alternate bot token)."
              echo "2. Retry once PR creation permissions are restored."
              echo ""
              echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
            } > .outcome-comment.md
            gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
            rm -f .outcome-comment.md
          elif [ "$WORKER_TIMED_OUT" = "true" ]; then
            if [ "$ATTEMPTS" -ge 4 ]; then
              echo "result=infra-failure" >> "$GITHUB_OUTPUT"
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=worker_timeout_nonconvergent" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --add-label "agent:actionable" \
                --add-label "triage/ready" \
                --add-label "agent:infra-blocked" \
                --add-label "agent:management-needed" \
                --add-label "agent:manual-review-needed" || true
              {
                echo "**Agent Work Loop** — worker timed out repeatedly."
                echo ""
                echo "- **Provider attempted:** $PROVIDER_USED"
                echo "- **Attempts:** $ATTEMPTS"
                echo "- **Timeout signals:** codex_primary=$CODEX_PRIMARY_TIMED_OUT, codex_fallback=$CODEX_FALLBACK_TIMED_OUT"
