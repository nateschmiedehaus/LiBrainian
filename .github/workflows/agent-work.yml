            NO_PROGRESS=false
            if [ "$GATE_NO_CHANGES" = "true" ] || { [ "$GATE_COMMITS" -eq 0 ] && [ "$GATE_CHANGED_COUNT" -eq 0 ]; }; then
              NO_PROGRESS=true
            fi
            if [ "$EVIDENCE_STATUS" = "no_changes" ]; then
              NO_PROGRESS=true
            fi

            if [ "$NO_PROGRESS" = "true" ]; then
              if [ "$ATTEMPTS" -ge 4 ]; then
                echo "result=needs-management" >> "$GITHUB_OUTPUT"
                echo "escalate=true" >> "$GITHUB_OUTPUT"
                echo "escalation_reason=no_progress_nonconvergent" >> "$GITHUB_OUTPUT"
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:claimed" \
                  --remove-label "verify:pending" \
                  --remove-label "agent:actionable" \
                  --remove-label "agent:needs-decomposition" \
                  --add-label "agent:management-needed" \
                  --add-label "agent:manual-review-needed" \
                  --add-label "triage/missing-essentials"
                {
                  echo "**Agent Work Loop** — repeated no-progress runs detected."
                  echo ""
                  echo "- **Provider:** $PROVIDER_USED"
                  echo "- **Worker outcome:** $WORKER_OUTCOME"
                  echo "- **Evidence status/source:** $EVIDENCE_STATUS / $EVIDENCE_SOURCE"
                  echo "- **Commits produced:** $GATE_COMMITS"
                  echo "- **Changed files:** $GATE_CHANGED_COUNT"
                  echo "- **Attempts:** $ATTEMPTS"
                  echo ""
                  echo "Automation escalated this issue to management for scope/requirements correction."
                  echo ""
                  echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"failed\",\"meta_eval\":\"non_convergent\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"manual_review\"} -->"
                } > .outcome-comment.md
                gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
                rm -f .outcome-comment.md
              else
                echo "result=retry-no-progress" >> "$GITHUB_OUTPUT"
                gh issue edit "$NUM" -R "$REPO" \
                  --remove-label "agent:claimed" \
                  --remove-label "verify:pending" \
                  --remove-label "agent:needs-decomposition" \
                  --remove-label "agent:management-needed" \
                  --remove-label "agent:manual-review-needed" \
                  --add-label "agent:actionable" \
                  --add-label "triage/ready" || true
                {
                  echo "**Agent Work Loop** — no code changes were produced."
                  echo ""
                  echo "- **Provider:** $PROVIDER_USED"
                  echo "- **Evidence status/source:** $EVIDENCE_STATUS / $EVIDENCE_SOURCE"
                  echo "- **Commits produced:** $GATE_COMMITS"
                  echo "- **Changed files:** $GATE_CHANGED_COUNT"
                  echo "- **Attempts:** $ATTEMPTS"
                  echo ""
                  echo "Issue remains actionable for another focused attempt (narrower scope and explicit file targets)."
                  echo ""
                  echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"no_changes\",\"meta_eval\":\"replanned\",\"managerial_fix\":\"requirements_patch\",\"next_action\":\"retry\"} -->"
                } > .outcome-comment.md
                gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
                rm -f .outcome-comment.md
              fi
            elif [ "$EVIDENCE_STATUS" = "needs_decomposition" ] || [ "$NEXT_ACTION" = "decompose" ]; then
              echo "result=needs-decomposition" >> "$GITHUB_OUTPUT"
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=decomposition_required" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --remove-label "agent:actionable" \
                --add-label "agent:needs-decomposition" \
                --add-label "agent:management-needed" \
                --add-label "agent:manual-review-needed" \
                --add-label "triage/missing-essentials"
              {
                echo "**Agent Work Loop** — issue needs decomposition before further automation."
                echo ""
                echo "- **Run:** $RUN_URL"
                echo "- **Provider:** $PROVIDER_USED"
                echo "- **Evidence status/source:** $EVIDENCE_STATUS / $EVIDENCE_SOURCE"
                echo "- **Suggested next_action:** $NEXT_ACTION"
                echo ""
                echo "Decomposition checklist:"
                echo "1. Split into 2-4 narrow sub-issues with explicit file paths."
                echo "2. Add measurable acceptance criteria per sub-issue."
                echo "3. Re-add \`agent:actionable\` only to well-scoped sub-issues."
                echo ""
                echo "<!-- agent_evidence = {\"v\":3,\"issue\":$NUM,\"role\":\"worker\",\"run\":\"$RUN_ID\",\"provider\":\"$PROVIDER_USED\",\"status\":\"needs_decomposition\",\"meta_eval\":\"non_convergent\",\"managerial_fix\":\"scope_split\",\"next_action\":\"manual_review\"} -->"
              } > .outcome-comment.md
              gh issue comment "$NUM" -R "$REPO" --body-file .outcome-comment.md
              rm -f .outcome-comment.md
            else
              echo "result=infra-failure" >> "$GITHUB_OUTPUT"
              echo "escalate=true" >> "$GITHUB_OUTPUT"
              echo "escalation_reason=outcome_inconsistent_state" >> "$GITHUB_OUTPUT"
              gh issue edit "$NUM" -R "$REPO" \
                --remove-label "agent:claimed" \
                --remove-label "verify:pending" \
                --remove-label "agent:needs-decomposition" \
                --add-label "agent:actionable" \
                --add-label "triage/ready" \
                --add-label "agent:management-needed" \
                --add-label "agent:manual-review-needed" || true
              {
                echo "**Agent Work Loop** — inconsistent success state detected."
                echo ""
                echo "- **Provider:** $PROVIDER_USED"
                echo "- **Worker outcome:** $WORKER_OUTCOME"
                echo "- **Gate outcome:** $GATE_OUTCOME"
