name: Agent Verify Loop

# Independent verification and auto-merge of agent-submitted PRs.
# This is a STRATEGIC REVIEWER, not a checkbox verifier.
# It evaluates whether changes fulfill the original intent AND
# move LiBrainian toward its milestone goals in the best way.
#
# CRITICAL: This is a DIFFERENT agent session from the Worker.
# The agent that did the work NEVER verifies its own work.
#
# On PASS: auto-merges the PR and closes the issue.
# On FAIL: closes the PR with specific, actionable feedback.

on:
  schedule:
    - cron: '45 1,4,7,10,13,16,19,22 * * *'  # Every 3 hours at :45 (offset from work loop)
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue to verify (blank = auto-select)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: agent-verify-loop
  cancel-in-progress: false

env:
  REPO: nateschmiedehaus/LiBrainian

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Find Issue Needing Verification ──────────────────────────────
      - name: Find issue to verify
        id: find
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            NUM="${{ inputs.issue_number }}"
          else
            # Find oldest issue with verify:pending label
            NUM=$(gh issue list -R "$REPO" --state open \
              --label "verify:pending" \
              --limit 10 \
              --json number --jq 'sort_by(.number) | first | .number // empty')
          fi

          if [ -z "$NUM" ]; then
            echo "No issues pending verification."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"

          # Find the linked PR
          TITLE=$(gh issue view "$NUM" -R "$REPO" --json title --jq '.title')
          echo "issue_title=$TITLE" >> "$GITHUB_OUTPUT"

          # Get issue milestone for strategic context
          MILESTONE=$(gh issue view "$NUM" -R "$REPO" --json milestone --jq '.milestone.title // "none"')
          echo "milestone=$MILESTONE" >> "$GITHUB_OUTPUT"

          # Look for PR that closes this issue
          PR=$(gh pr list -R "$REPO" --state open \
            --search "closes #$NUM" \
            --json number,headRefName --jq 'first | .number // empty')

          if [ -z "$PR" ]; then
            # Try finding by branch name convention
            PR=$(gh pr list -R "$REPO" --state open \
              --head "claude/issue-$NUM" \
              --json number --jq 'first | .number // empty')
          fi

          if [ -z "$PR" ]; then
            echo "::warning::No PR found for issue #$NUM"
            echo "pr_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
            echo "pr_found=true" >> "$GITHUB_OUTPUT"

            # Get PR branch
            BRANCH=$(gh pr view "$PR" -R "$REPO" --json headRefName --jq '.headRefName')
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if nothing to verify
        if: steps.find.outputs.found != 'true' || steps.find.outputs.pr_found != 'true'
        run: |
          if [ "${{ steps.find.outputs.found }}" != "true" ]; then
            echo "No issues pending verification."
          else
            echo "Issue #${{ steps.find.outputs.issue_number }} has verify:pending but no PR."
            # Remove stale label
            gh issue edit "${{ steps.find.outputs.issue_number }}" -R "$REPO" \
              --remove-label "verify:pending" --add-label "agent:blocked"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fast-fail if Claude auth token is missing
      - name: Validate Claude auth token
        if: steps.find.outputs.pr_found == 'true'
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN secret is empty. Refresh it from local machine."
            exit 1
          fi
          echo "Claude auth token present"

      # ── Setup ────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        if: steps.find.outputs.pr_found == 'true'
        with:
          ref: ${{ steps.find.outputs.branch }}
          fetch-depth: 0  # Full history for diff

      - uses: actions/setup-node@v4
        if: steps.find.outputs.pr_found == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        if: steps.find.outputs.pr_found == 'true'
        run: npm ci && npm run build

      # ── Gather Evidence for Verifier ─────────────────────────────────
      - name: Gather context for verification
        if: steps.find.outputs.pr_found == 'true'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          PR=${{ steps.find.outputs.pr_number }}

          # Get issue body and comments (worker evidence)
          gh issue view "$NUM" -R "$REPO" --json body,title,labels,comments,milestone \
            > .claude-issue-full.json

          # Get PR diff
          gh pr diff "$PR" -R "$REPO" > .claude-pr-diff.patch 2>/dev/null || true

          # Get PR file list
          gh pr view "$PR" -R "$REPO" --json files --jq '.files[].path' \
            > .claude-pr-files.txt 2>/dev/null || true

          # Get worker evidence comments
          gh issue view "$NUM" -R "$REPO" --json comments \
            --jq '.comments[] | select(.body | contains("agent_evidence")) | .body' \
            > .claude-worker-evidence.txt 2>/dev/null || true

          # Get milestone context
          gh api repos/$REPO/milestones --jq '.[] | "## \(.title)\n\(.description // "No description")\n"' \
            > .claude-milestone-context.md 2>/dev/null || true

          echo "Context gathered for verification."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Verification Agent ──────────────────────────────────────────
      - name: Run verification agent
        if: steps.find.outputs.pr_found == 'true'
        id: verify
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true

          prompt: |
            You are a STRATEGIC CODE REVIEWER for the LiBrainian project — a semantic
            codebase intelligence tool that helps AI agents understand and navigate code.

            You are reviewing PR #${{ steps.find.outputs.pr_number }} which implements
            issue #${{ steps.find.outputs.issue_number }} ("${{ steps.find.outputs.issue_title }}").
            Milestone: ${{ steps.find.outputs.milestone }}

            YOUR VERDICT WILL AUTO-MERGE OR REJECT THIS PR. There is no human reviewer
            after you. You are the last line of defense. Be thorough but fair.

            ## Context Files
            - .claude-issue-full.json — full issue with comments and acceptance criteria
            - .claude-pr-diff.patch — the PR diff
            - .claude-pr-files.txt — files changed
            - .claude-worker-evidence.txt — worker's evidence claims
            - .claude-milestone-context.md — milestone descriptions and goals

            ## Your Review Process

            ### Phase 1: Mechanical Verification (table stakes — must all pass)
            1. Run `npm run build` — must compile clean
            2. Run tests on changed files: `npm test -- --testPathPattern <pattern>`
            3. Check the diff for obvious bugs, security issues, or broken patterns
            4. Verify each acceptance criterion from the issue is actually met

            ### Phase 2: Intent Fulfillment (the real question)
            Go beyond "did they check the boxes?" Ask yourself:
            - Does this implementation actually solve the UNDERLYING PROBLEM the issue describes?
            - Or did the worker do the minimum to satisfy acceptance criteria without
              addressing the real need?
            - Would a senior engineer reviewing this say "yes, this is the right approach"
              or "this technically works but misses the point"?
            - Are there obvious better approaches the worker should have taken?

            ### Phase 3: Strategic Fit (does this move LiBrainian forward?)
            Read .claude-milestone-context.md and consider:
            - Does this change move us toward the milestone's exit criteria?
            - Does it create technical debt that will slow down future work?
            - Is the code maintainable? Will the next developer understand it?
            - Does it follow the existing patterns in the codebase, or introduce
              unnecessary divergence?
            - Is the test coverage meaningful (testing behavior, not implementation)?

            ### Phase 4: Qualitative Assessment
            Rate the implementation:
            - **Excellent**: Solves the problem elegantly, well-tested, advances the milestone
            - **Good**: Solid implementation, meets the intent, no concerns
            - **Acceptable**: Works but has minor issues that don't block merge
            - **Poor**: Technically works but misses the intent or creates problems — FAIL
            - **Broken**: Doesn't work, doesn't compile, or has critical issues — FAIL

            Only "Excellent", "Good", and "Acceptable" should result in PASS.
            "Poor" and "Broken" are FAIL.

            ## Your Verdict

            Use the Write tool to create `.verdict-comment.md` with your review, then post it:
            ```
            gh issue comment ${{ steps.find.outputs.issue_number }} --repo nateschmiedehaus/LiBrainian --body-file .verdict-comment.md
            ```
            Do NOT use heredocs or $(cat <<EOF) — they get blocked by the sandbox.

            Your comment MUST begin with exactly one of these lines:

            **Verdict: PASS**

            or:

            **Verdict: FAIL**

            Then include ALL of the following sections:

            ### Mechanical Checks
            - Build: pass/fail
            - Tests: X passed, Y failed
            - Acceptance criteria: each one checked

            ### Intent Assessment
            [2-3 sentences: Does this solve the real problem?]

            ### Strategic Fit
            [2-3 sentences: How does this advance the milestone? Any concerns?]

            ### Quality Rating
            [Excellent / Good / Acceptable / Poor / Broken — with brief justification]

            End with the metadata tag:
            <!-- agent_evidence = {"v":2,"issue":${{ steps.find.outputs.issue_number }},"role":"verifier","verdict":"VERDICT","quality":"RATING","pr":${{ steps.find.outputs.pr_number }}} -->

            ## Rules
            - You MUST NOT trust the worker's claims. Verify everything independently.
            - PASS means you are confident this should be merged to main.
            - FAIL means you would NOT merge this — explain exactly what's wrong and
              what the worker should do differently.
            - Be specific. Vague feedback like "needs improvement" is useless.
            - Use Write tool + --body-file for posting (NOT heredocs).
            - IMPORTANT: Do NOT pipe commands (e.g., `npm test | tail`). Pipes get
              permission-denied. Instead, redirect to a file and read it:
              ```
              npm test > .test-output.txt 2>&1; tail -20 .test-output.txt
              ```

          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 20
            --allowedTools "Edit,Write,Read,Grep,Glob,Bash(gh *),Bash(npm *),Bash(npx *),Bash(git *),Bash(cat *),Bash(ls *),Bash(find *),Bash(wc *),Bash(head *),Bash(tail *),Bash(grep *),Bash(sed *),Bash(awk *),Bash(echo *),Bash(mkdir *)"

        continue-on-error: true

      # ── Post-Verification: Auto-merge or Reject ─────────────────────
      - name: Parse verdict and act
        if: steps.find.outputs.pr_found == 'true'
        id: verdict
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          PR=${{ steps.find.outputs.pr_number }}

          # Check if the verifier agent actually ran successfully
          AGENT_EXIT="${{ steps.verify.outcome }}"
          echo "Agent outcome: $AGENT_EXIT"

          if [ "$AGENT_EXIT" = "failure" ]; then
            echo "::warning::Verifier agent failed (likely auth or infra issue). Will retry on next schedule."
            # Silent retry — leave verify:pending for next run. No inbox spam.
            exit 0
          fi

          # Check the latest comments for a verdict
          VERDICT=$(gh issue view "$NUM" -R "$REPO" --json comments \
            --jq '.comments[-3:] | .[] | .body' | \
            grep -oiE 'Verdict:[[:space:]]*\*{0,2}(PASS|FAIL)\*{0,2}' | tail -1 | \
            grep -oiE '(PASS|FAIL)' | tr '[:lower:]' '[:upper:]' || echo "UNKNOWN")

          echo "Verdict: $VERDICT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          if [ "$VERDICT" = "PASS" ]; then
            echo "=== AUTO-MERGING PR #$PR ==="

            # Update labels
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "verify:pending" \
              --remove-label "agent:actionable" \
              --add-label "verify:pass"

            # Squash-merge the PR
            gh pr merge "$PR" -R "$REPO" --squash --auto \
              --subject "fix: #$NUM — ${{ steps.find.outputs.issue_title }}" \
              --body "Automated implementation of #$NUM.

            Verified by independent agent reviewer.
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              2>/dev/null || \
            gh pr merge "$PR" -R "$REPO" --squash \
              --subject "fix: #$NUM — ${{ steps.find.outputs.issue_title }}" 2>/dev/null || \
            echo "::warning::Auto-merge failed. PR may need manual merge."

            echo "PR #$PR merged. Issue #$NUM resolved."

          elif [ "$VERDICT" = "FAIL" ]; then
            echo "=== REJECTING PR #$PR ==="

            # Close the PR (don't delete branch — keep evidence)
            gh pr close "$PR" -R "$REPO" --comment "Verification FAILED. See issue #$NUM for detailed feedback. The worker should address the reviewer's concerns and resubmit."

            # Return issue to backlog for rework
            gh issue edit "$NUM" -R "$REPO" \
              --remove-label "verify:pending" \
              --remove-label "agent:claimed" \
              --add-label "verify:fail"

            echo "PR #$PR closed. Issue #$NUM returned to backlog."

          else
            echo "::warning::Verifier ran but did not post a clear verdict. Will retry on next schedule."
            # Silent — leave verify:pending for next scheduled run.
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Auto-unblock dependent issues after merge ──────────────────
      # When a PASS verdict merges a PR and closes its issue, check if any
      # agent:blocked issues were waiting on it and unblock them.
      - name: Auto-unblock dependent issues
        if: steps.verdict.outputs.verdict == 'PASS'
        run: |
          NUM=${{ steps.find.outputs.issue_number }}
          echo "=== Auto-unblocking issues dependent on #$NUM ==="

          # Find all blocked issues
          BLOCKED_NUMS=$(gh issue list -R "$REPO" --state open \
            --label "agent:blocked" \
            --limit 50 \
            --json number --jq '.[].number')

          if [ -z "$BLOCKED_NUMS" ]; then
            echo "No blocked issues found."
            exit 0
          fi

          echo "Blocked issues: $(echo $BLOCKED_NUMS | tr '\n' ' ')"

          for BNUM in $BLOCKED_NUMS; do
            echo "--- Checking #$BNUM ---"

            # Get body and comments to find "Blocked by:" declarations
            ISSUE_BODY=$(gh issue view "$BNUM" -R "$REPO" --json body --jq '.body' 2>/dev/null || echo "")
            ISSUE_COMMENTS=$(gh issue view "$BNUM" -R "$REPO" --json comments --jq '.comments[].body' 2>/dev/null || echo "")

            # Extract dependency issue numbers from "Blocked by:" lines
            # Strip parenthetical context first to avoid false matches like "(all #883 sub-issues)"
            ALL_TEXT=$(printf '%s\n%s' "$ISSUE_BODY" "$ISSUE_COMMENTS")
            DEPS=$(echo "$ALL_TEXT" | grep -iE 'blocked by:' | sed 's/(.*//' | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | sort -un)

            if [ -z "$DEPS" ]; then
              echo "  No 'Blocked by:' dependencies found — skipping"
              continue
            fi

            echo "  Dependencies: $(echo $DEPS | tr '\n' ' ')"

            ALL_RESOLVED=true
            for DEP in $DEPS; do
              DEP_STATE=$(gh issue view "$DEP" -R "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              if [ "$DEP_STATE" != "CLOSED" ]; then
                echo "  #$DEP is $DEP_STATE — still blocked"
                ALL_RESOLVED=false
                break
              fi
            done

            if [ "$ALL_RESOLVED" = "true" ]; then
              echo "  All dependencies resolved — unblocking #$BNUM!"
              gh issue edit "$BNUM" -R "$REPO" \
                --remove-label "agent:blocked" \
                --add-label "agent:actionable"

              # Post unblock notification
              {
                echo "**Auto-unblocked** — all blocking dependencies are now resolved."
                echo ""
                echo "Dependencies checked: $(echo $DEPS | tr '\n' ', ' | sed 's/,$//')"
                echo ""
                echo "This issue is now available for the worker agent."
              } > .unblock-comment.md
              gh issue comment "$BNUM" -R "$REPO" --body-file .unblock-comment.md
              rm -f .unblock-comment.md
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
