name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast validation
        run: npm run validate:fast

      - name: Public acceptance smoke
        run: npm run test:e2e:acceptance

      - name: Package identity guard
        run: npm run package:assert-identity

      - name: Public tarball contract
        run: npm run public:pack

  prune-history:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Prune stale action history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prune-github-action-runs.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --current-sha "$GITHUB_SHA" \
            --keep-workflow ci \
            --keep-workflow npm-publish
