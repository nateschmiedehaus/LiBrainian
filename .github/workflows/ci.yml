name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast validation
        run: npm run validate:fast

      - name: Public acceptance smoke
        run: npm run test:e2e:acceptance

      - name: Package identity guard
        run: npm run package:assert-identity

      - name: Public tarball contract
        run: npm run public:pack
